</head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><b>FINGOOSE</b><span>宏观事件与公司影响研究工作台</span></div><div class="side-state">高质量候选数据<br>证据、推断与价格结果分层展示</div><div class="side-label">十个宏观事件</div><nav class="event-nav" id="event-nav"></nav><div class="side-foot">50 个时间线节点<br>30 条事件-公司映射<br>所有 AI 方向待人工审核</div></aside><div class="workspace"><header class="topbar"><strong>事件、行业与公司影响链</strong><span>点击事件、节点、行业或公司查看联动证据</span><button class="menu" id="menu" aria-label="打开事件目录">事件目录</button></header><main class="content" id="main"></main></div></div><script>
const DATA=window.FINGOOSE_COMPANY_IMPACT_V2;
const state={eventId:DATA.events[0].event_id,nodeId:null,companyId:null,industryId:null,transmissionMode:'operating'};
const zhStatus={VERIFIED_EXISTING:'已有证据',PENDING_EVIDENCE:'待补证',NEEDS_HUMAN_REVIEW:'待人工审核',PARTIALLY_VERIFIED:'部分验证',DATA_PENDING:'数据待补',UNVERIFIED:'未核实',CANDIDATES_REGISTERED_NEEDS_BODY_REVIEW:'候选已登记，正文待审',SEARCH_PENDING:'检索待完成',AVAILABLE:'可用',CHALLENGE_ONLY:'仅挑战集',OFFICIAL_HISTORY_ASOF_MATCHED:'官方历史分类已按事件日匹配',VERIFIED_ACTIVE_ASOF:'事件日有效',SOURCE_VERIFIED_RULE_APPLIED:'来源已核验，规则已应用'};
const zhPhase={PRECONDITION:'前置背景',INITIAL_SHOCK:'首次冲击',ESCALATION:'升级',POLICY_RESPONSE:'政策响应',EASING:'缓和',SECONDARY_SHOCK:'二次冲击'};
const zhDirection={POSITIVE:'正向',NEGATIVE:'负向',MIXED:'混合',NEUTRAL:'中性',UNKNOWN:'未知',UP:'上行',DOWN:'下行'};
const horizons=[['T_MINUS_1','T-1'],['T0','T0'],['D1','D1'],['D3','D3'],['D5','D5'],['D20','D20']];
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt=value=>value==null?'数据待补':Number(value).toLocaleString('zh-CN',{maximumFractionDigits:4});
const pct=value=>value==null?'数据待补':(Number(value)*100).toFixed(2)+'%';
const status=value=>zhStatus[value]||value||'数据待补';
const direction=value=>zhDirection[value]||value||'未知';
function humanNode(id){const text=String(id||'');const token=text.split('-').slice(3).join('-')||text;const map={'shock':'事件冲击','risk-appetite':'风险偏好渠道','safe-haven-demand':'避险需求渠道','energy-supply':'能源供应渠道','discount-rate':'贴现率渠道','rate-expectations':'利率预期渠道','rate-differential':'利差渠道','dollar-liquidity':'美元流动性渠道','global-demand':'全球需求渠道','bank-funding':'银行融资渠道'};for(const [key,label] of Object.entries(map)){if(token.includes(key))return label}if(text.includes('-asset-'))return '资产：'+token.toUpperCase();if(text.includes('-intermediate-'))return '中间变量：'+token.toUpperCase();return token||'待命名节点'}
function currentEvent(){return DATA.events.find(event=>event.event_id===state.eventId)}
function renderSidebar(){document.getElementById('event-nav').innerHTML=DATA.events.map(event=>`<button class="event-button ${event.event_id===state.eventId?'active':''}" data-event="${event.event_id}"><small>${event.event_id.toUpperCase()}</small><span>${esc(event.title)}</span><i>${event.summary.verified_timeline_count}/${event.summary.timeline_count} 节点有证据 · ${event.summary.company_count} 家公司</i></button>`).join('');document.querySelectorAll('[data-event]').forEach(button=>button.onclick=()=>{state.eventId=button.dataset.event;state.nodeId=null;state.industryId=null;state.companyId=null;render();document.getElementById('sidebar').classList.remove('open')})}
function eventEvidence(node){const evidence=(node.evidence||[])[0];if(!evidence)return '<span class="chip warn">无可展示证据</span>';return `<a class="evidence-link" href="${esc(evidence.url)}" target="_blank" rel="noopener noreferrer">证据：${esc(evidence.publisher||evidence.source_id)}</a>`}
function renderTimeline(event){return event.timeline.map(node=>`<article class="timeline-node ${state.nodeId===node.fast_node_id?'selected':''}" data-node="${esc(node.fast_node_id)}" role="button" tabindex="0" aria-label="${esc(node.event_title_zh)}"><span class="timeline-time">${esc(node.occurred_at||'\u65f6\u95f4\u5f85\u8865')}</span><span class="timeline-rail"></span><div class="timeline-body"><h3>${esc(node.event_title_zh)}</h3><div class="timeline-meta"><span>${esc(zhPhase[node.phase]||node.phase||'\u9636\u6bb5\u5f85\u5b9a')}</span><span>\u53d1\u751f\u65f6\u95f4 ${esc(node.occurred_at||'\u5f85\u8865')}</span><span>\u65f6\u95f4\u7cbe\u5ea6 ${esc(node.occurred_at_precision||node.first_public_at_precision||'\u5f85\u8865')}</span></div><p class="timeline-summary">${esc(node.event_summary_zh)}</p><div class="chips"><span class="chip ${node.evidence_status==='VERIFIED_EXISTING'?'good':'warn'}">${esc(status(node.evidence_status))}</span><span class="chip">${esc(node.node_action||'\u52a8\u4f5c\u5f85\u5b9a')}</span>${eventEvidence(node)}</div><details class="timeline-tech"><summary>\u6280\u672f\u8be6\u60c5</summary><div class="timeline-tech-body"><dl><dt>\u8282\u70b9 ID</dt><dd>${esc(node.fast_node_id)}</dd><dt>\u539f\u59cb\u4e8b\u5b9e</dt><dd>${esc(node.fact||'\u5f85\u8865')}</dd><dt>\u6765\u6e90 ID</dt><dd>${esc((node.source_ids||[]).join('\u3001')||'\u5f85\u8865')}</dd><dt>\u9996\u6b21\u516c\u5f00</dt><dd>${esc(node.first_public_at||'\u5f85\u8865')}</dd></dl></div></details></div></article>`).join('')}

function pathAnchors(path,mode){return mode==='operating'?[path.timeline_node_id]:(path.anchor_fast_node_ids||[path.anchor_fast_node_id])}
function filterPathSet(paths,mode){if(!state.nodeId)return {paths,note:''};const matched=paths.filter(path=>pathAnchors(path,mode).includes(state.nodeId));if(matched.length)return {paths:matched,note:''};return {paths,note:'\u5f53\u524d\u65f6\u95f4\u8282\u70b9\u6ca1\u6709\u76f4\u63a5\u7ed1\u5b9a\u7684\u5b8c\u6574\u8def\u5f84\uff0c\u4ee5\u4e0b\u7ee7\u7eed\u663e\u793a\u8be5\u4e8b\u4ef6\u5168\u90e8\u8def\u5f84\u3002'}}

function renderOperatingPaths(event){
  const filtered=filterPathSet(event.operating_transmission_paths||[],'operating');
  if(!filtered.paths.length)return '<div class="empty">\u7ecf\u8425\u5f71\u54cd\u94fe\u5f85\u751f\u6210\u3002</div>';
  const cards=filtered.paths.map(path=>{
    const company=event.companies.find(item=>item.mapping_id===path.mapping_id||item.company_id===path.company_id)||{};
    const flow=(path.nodes||[]).map((node,index)=>`<div class="transmission-step"><small>${index+1} / 7 &middot; ${esc(mechanismLabels[node.node_type]||node.node_type)}</small><b>${esc(node.statement)}</b>${chainEvidenceHtml(node,company,event)}</div>`).join('');
    const h=path.horizon_directions||{};
    const metrics=(path.operating_metrics||[]).map(item=>`<span class="chip">${esc(item.name)} &middot; ${esc(item.unit)}</span>`).join('');
    const edgeIds=(path.edges||[]).map(item=>item.edge_id).join('\u3001');
    const nodeIds=(path.nodes||[]).map(item=>item.node_id).join('\u3001');
    return `<article class="transmission-card operating"><header class="transmission-card-head"><div><span class="eyebrow">${esc(path.timeline?.event_title_zh||'\u4e8b\u4ef6\u951a\u70b9\u5f85\u8865')}</span><h3>${esc(path.company_name)} &middot; ${esc(path.industry||'\u884c\u4e1a\u5f85\u6620\u5c04')}</h3><p>${esc(path.timeline?.event_summary_zh||'')}</p></div><div class="transmission-actions"><span class="chip warn">${esc(status(path.review_status))}</span><button class="link-button" data-path-company="${esc(path.company_id)}">\u67e5\u770b\u516c\u53f8\u4ef7\u683c\u4e0e\u8bc1\u636e</button></div></header><div class="transmission-flow-wrap"><div class="transmission-flow">${flow}</div></div><div class="transmission-card-meta"><div><b>\u5373\u65f6 / \u77ed\u671f / \u4e2d\u671f</b>${esc(direction(h.IMMEDIATE))} / ${esc(direction(h.SHORT_TERM))} / ${esc(direction(h.MEDIUM_TERM))}</div><div><b>\u53ef\u89c2\u6d4b\u7ecf\u8425\u6307\u6807</b>${metrics||'\u6307\u6807\u5f85\u8865'}</div><div><b>\u751f\u6548\u4e0e\u5931\u6548\u8fb9\u754c</b>${esc((path.conditions||[]).join('\uff1b')||'\u5f85\u8865')}<br><span class="chip warn">${esc((path.invalidation_conditions||[]).join('\uff1b')||'\u5f85\u8865')}</span></div></div><details class="raw-details"><summary>\u5e95\u5c42\u7ed1\u5b9a\u4e0e\u6280\u672f\u8be6\u60c5</summary><div class="raw-details-body"><p><b>mapping_id:</b> <code>${esc(path.mapping_id)}</code></p><p><b>primary_binding_id:</b> <code>${esc(path.primary_binding_id)}</code></p><p><b>chain_id:</b> <code>${esc(path.chain_id)}</code></p><p><b>node_ids:</b> <code>${esc(nodeIds)}</code></p><p><b>edge_ids:</b> <code>${esc(edgeIds)}</code></p><p><b>\u53d1\u5e03\u8fb9\u754c:</b> formal_ready=false &middot; SHA DEFERRED &middot; ${esc(path.chain_status)}</p></div></details></article>`;
  }).join('');
  return `${filtered.note?`<div class="filter-note">${esc(filtered.note)}</div>`:''}<div class="transmission-stack">${cards}</div>`;
}

function macroEvidenceHtml(records,label){
  if(!records?.length)return `<span class="chip warn">${esc(label)}\u5f85\u8865</span>`;
  return records.map(item=>`<div class="evidence-item"><b>${esc(label)} &middot; ${esc(item.publisher||item.evidence_id)}</b><p>${esc(item.quote||'\u539f\u6587\u5f85\u8865')}</p><small>${esc(item.locator||'\u5b9a\u4f4d\u7b26\u5f85\u8865')} &middot; ${esc(item.evidence_scope||'')}</small><br><a class="evidence-link" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">\u6253\u5f00\u5b98\u65b9\u8bc1\u636e</a></div>`).join('');
}

function renderMacroPaths(event){
  const filtered=filterPathSet(event.macro_transmission_paths||[],'macro');
  if(!filtered.paths.length)return '<div class="empty">\u5b8f\u89c2\u5e02\u573a\u94fe\u5f85\u751f\u6210\u3002</div>';
  const cards=filtered.paths.map(path=>{
    const indicator=path.market_indicator||{},channel=path.channel||{},h=path.expected_path||{};
    const contexts=(path.timeline_contexts||[]).map(item=>`<li>${esc(item.occurred_at||'\u65f6\u95f4\u5f85\u8865')} &middot; ${esc(item.event_title_zh)}</li>`).join('');
    const eventEvidence=macroEvidenceHtml(path.event_fact_evidence,'\u4e8b\u4ef6\u4e8b\u5b9e\u8bc1\u636e');
    const mechanismEvidence=macroEvidenceHtml(path.mechanism_evidence,'\u673a\u5236\u8f85\u52a9\u8bc1\u636e');
    const reviewText=(path.raw_edges||[]).map(item=>item.review?.rationale_zh).filter(Boolean).filter((value,index,array)=>array.indexOf(value)===index).join('\uff1b');
    return `<article class="transmission-card macro"><header class="transmission-card-head"><div><span class="eyebrow">${esc(path.macro_path_id)}</span><h3>${esc(path.event_title_zh)} \u5982\u4f55\u4f20\u5bfc\u81f3 ${esc(indicator.name_zh)}</h3><p>${esc(path.event_summary_zh)}</p></div><span class="chip warn">${esc((path.binding_statuses||[]).map(status).join('\u3001'))}</span></header><div class="transmission-flow-wrap"><div class="transmission-flow macro-flow"><div class="transmission-step"><small>\u5177\u4f53\u4e8b\u4ef6\u4e0e\u65f6\u95f4</small><b>${esc(path.event_title_zh)}</b><p>${esc(path.event_summary_zh)}</p><div class="chips"><span class="chip">${esc((path.anchor_fast_node_ids||[]).join('\u3001'))}</span></div></div><div class="transmission-arrow">&rarr;</div><div class="transmission-step"><small>\u6709\u65b9\u5411\u7684\u4f20\u5bfc\u6e20\u9053</small><b>${esc(channel.direction_label_zh)}</b><p>${esc(channel.economic_meaning_zh)}</p></div><div class="transmission-arrow">&rarr;</div><div class="transmission-step"><small>\u4e2d\u6587\u5e02\u573a\u6307\u6807</small><b>${esc(indicator.name_zh)}</b><span class="macro-indicator-code">${esc(indicator.code)} &middot; ${esc(indicator.unit_zh)}</span><p>${esc(indicator.economic_meaning_zh)}</p><p><b>\u9884\u671f\u65b9\u5411\uff1a</b>${esc(indicator.direction_interpretation_zh)}</p><div class="macro-directions"><span class="chip">\u5373\u65f6 ${esc(direction(h.IMMEDIATE))}</span><span class="chip">\u77ed\u671f ${esc(direction(h.SHORT_TERM))}</span><span class="chip">\u4e2d\u671f ${esc(direction(h.MEDIUM_TERM))}</span></div></div></div></div><div class="transmission-card-meta"><div><b>\u751f\u6548\u6761\u4ef6</b>${esc((path.conditions||[]).join('\uff1b')||'\u5f85\u8865')}</div><div><b>\u5931\u6548\u6761\u4ef6</b>${esc((path.invalidation_conditions||[]).join('\uff1b')||'\u5f85\u8865')}</div><div><b>\u53cd\u8bc1\u4e0e\u7ade\u4e89\u89e3\u91ca</b>${esc((path.counterevidence||[]).join('\uff1b')||'\u672a\u767b\u8bb0')}</div></div><details class="raw-details"><summary>\u8bc1\u636e\u3001\u5e95\u5c42\u7ed1\u5b9a\u4e0e\u6280\u672f\u8be6\u60c5</summary><div class="raw-details-body"><div class="transmission-evidence">${eventEvidence}${mechanismEvidence}</div><p><b>\u591a\u951a\u70b9\u4e0a\u4e0b\u6587:</b></p><ul>${contexts||'<li>\u65e0</li>'}</ul><p><b>binding_ids:</b> <code>${esc((path.binding_ids||[]).join('\u3001'))}</code></p><p><b>edge_ids:</b> <code>${esc((path.edge_ids||[]).join('\u3001'))}</code></p><p><b>node_ids:</b> <code>${esc((path.node_ids||[]).join('\u3001'))}</code></p><p><b>\u7f6e\u4fe1\u5ea6:</b> ${fmt(path.confidence)} &middot; <b>\u8fb9\u8bc1\u636e\u8303\u56f4:</b> ${esc((path.edge_support_statuses||[]).join('\u3001'))}</p><p><b>\u5ba1\u6838\u8bf4\u660e:</b> ${esc(reviewText||'\u5f85\u4eba\u5de5\u9010\u8fb9\u5ba1\u6838')}</p></div></details></article>`;
  }).join('');
  const unresolved=(event.unresolved_macro_edges||[]);
  const unresolvedHtml=unresolved.length?`<details class="raw-details"><summary>${unresolved.length} \u6761\u65e0\u6cd5\u7ec4\u6210\u5b8c\u6574\u8def\u5f84\u7684\u7ed1\u5b9a</summary><div class="raw-details-body">${unresolved.map(item=>`<p><code>${esc(item.binding_id)}</code> &middot; ${esc(item.from_node_id)} &rarr; ${esc(item.to_node_id)} &middot; ${esc(item.unresolved_reason)}</p>`).join('')}</div></details>`:'';
  return `${filtered.note?`<div class="filter-note">${esc(filtered.note)}</div>`:''}<div class="transmission-stack">${cards}${unresolvedHtml}</div>`;
}

function renderTransmission(event){return state.transmissionMode==='macro'?renderMacroPaths(event):renderOperatingPaths(event)}
function renderIndustries(event){return event.industries.map(industry=>`<button class="industry-button ${state.industryId===industry.industry_id?'active':''}" data-industry="${esc(industry.industry_id)}"><b>${esc(industry.industry_name)}</b><br><small>${industry.company_ids.length} 家公司 · ${esc(status(industry.classification_status))}</small></button>`).join('')||'<div class="empty">行业映射待补。</div>'}
function directionClass(value){return value==='POSITIVE'?'positive':value==='NEGATIVE'?'negative':''}
function renderCompanies(event){let companies=event.companies;if(state.industryId)companies=companies.filter(company=>(company.industry_classification?.sw1_id||'UNKNOWN')===state.industryId);return companies.map(company=>{const h=company.direction?.horizons||{};return `<button class="company-button ${state.companyId===company.company_id?'active':''}" data-company="${esc(company.company_id)}"><h3>${esc(company.company_name)} <small>${esc(company.company_code)}</small></h3><p>${esc(company.industry||'行业待映射')}</p><div class="directions"><span class="direction ${directionClass(h.IMMEDIATE)}">即时<br>${esc(direction(h.IMMEDIATE))}</span><span class="direction ${directionClass(h.SHORT_TERM)}">短期<br>${esc(direction(h.SHORT_TERM))}</span><span class="direction ${directionClass(h.MEDIUM_TERM)}">中期<br>${esc(direction(h.MEDIUM_TERM))}</span></div><span class="chips"><span class="chip warn">${esc(status(company.direction?.review_status))}</span><span class="chip">${esc(status(company.dossier?.dossier_status))}</span></span></button>`}).join('')||'<div class="empty">该筛选下没有公司。</div>'}
function chartSvg(company){const rel=company.relative_window?.observations||{};const points=horizons.map(([key,label])=>{const item=rel[key];if(!item)return null;const c=item.formula_inputs?.company||[];const m=item.formula_inputs?.market||[];return {label,company:c[0]&&c[1]!=null?100*c[1]/c[0]:null,market:m[0]&&m[1]!=null?100*m[1]/m[0]:null}}).filter(Boolean);const values=points.flatMap(p=>[p.company,p.market]).filter(v=>v!=null);if(!values.length)return '<div class="empty">图表数据待补。</div>';let min=Math.min(...values),max=Math.max(...values);if(max-min<2){min-=1;max+=1}const x=i=>55+i*(660/Math.max(1,points.length-1));const y=v=>215-(v-min)/(max-min)*175;const poly=key=>points.filter(p=>p[key]!=null).map((p,i)=>`${x(i)},${y(p[key])}`).join(' ');return `<svg viewBox="0 0 760 250" role="img" aria-label="公司与沪深300标准化走势"><g stroke="#e1e5e2" stroke-width="1"><line x1="55" y1="40" x2="715" y2="40"/><line x1="55" y1="127" x2="715" y2="127"/><line x1="55" y1="215" x2="715" y2="215"/></g><polyline fill="none" stroke="#a63f35" stroke-width="3" points="${poly('company')}"/><polyline fill="none" stroke="#236b66" stroke-width="3" points="${poly('market')}"/>${points.map((p,i)=>`<text x="${x(i)}" y="238" text-anchor="middle" font-size="11" fill="#667175">${p.label}</text>`).join('')}<text x="8" y="44" font-size="11" fill="#667175">${max.toFixed(1)}</text><text x="8" y="218" font-size="11" fill="#667175">${min.toFixed(1)}</text></svg>`}
function marketTable(company){const market=company.market_window?.observations||{},rel=company.relative_window?.observations||{};return horizons.map(([key,label])=>{const m=market[key]||{},r=rel[key]||{};return `<tr><td>${label}</td><td>${esc(m.actual_date||'数据待补')}</td><td>${fmt(m.forward_adjusted_close)}</td><td>${pct(m.absolute_return)}</td><td>${fmt(r.formula_inputs?.market?.[1])}</td><td>${pct(r.market_relative_return)}</td><td>${esc(status(r.industry_status))}</td></tr>`}).join('')}
function evidenceHtml(company){const rows=company.evidence||[];if(!rows.length)return '<div class="empty">公司证据待补。</div>';return rows.slice(0,10).map(row=>`<div class="evidence-item"><b>${esc(row.document_title||row.claim_type)}</b><p>${esc(row.original_quote||'引文待补')}</p><small>${esc(row.page_or_section_locator||'定位待补')} · ${esc(row.published_at||'日期待补')} · ${esc(status(row.review_status))}</small><br><a class="evidence-link" href="${esc(row.source_url)}" target="_blank" rel="noopener noreferrer">打开官方披露</a></div>`).join('')}
function confounderHtml(company){const record=company.confounders||{},items=record.registered_confounders||[];if(!items.length)return `<div class="empty">混杂证据按映射级门禁展示。当前等级：${esc(status(record.overall_grade))}。</div>`;return items.map(item=>`<div class="confounder-item"><b>${esc(item.quote)}</b><p>${esc(item.mechanism)}</p><small>${esc(item.first_public_at)} · 影响窗口 ${esc((item.affected_windows||[]).join('、'))} · ${esc(status(item.review_status))}</small><br><a class="evidence-link" href="${esc(item.source_url)}" target="_blank" rel="noopener noreferrer">打开巨潮资讯公告</a></div>`).join('')}
const mechanismLabels={EVENT_FACT:'事件事实',BEHAVIOR_OR_POLICY_CHANGE:'行为或政策变化',OBSERVABLE_OPERATING_VARIABLE:'可观测经营变量',INDUSTRY_REVENUE_OR_COST_VARIABLE:'行业收入或成本变量',COMPANY_BUSINESS_EXPOSURE:'公司业务暴露',DIRECTION_ASSESSMENT:'三期限方向判断',PRICE_AND_CONFOUNDER_VERIFICATION:'价格、混杂与反证验证'};
const closureGates=[
  ['经营机制链',['MECHANISM_CHAIN_INCOMPLETE']],
  ['公司 dossier',['DOSSIER_RESEARCH_INCOMPLETE']],
  ['三期限方向',['DIRECTION_HORIZONS_INCOMPLETE']],
  ['公司/大盘/行业窗口',['COMPANY_WINDOW_INCOMPLETE','INDUSTRY_WINDOW_INCOMPLETE']],
  ['混杂检索',['CONFOUNDER_REVIEW_INCOMPLETE']],
  ['停复牌状态',['SUSPENSION_REVIEW_INCOMPLETE']],
];
function chainEvidenceHtml(node,company,event){
  const links=[];
  for(const id of node.evidence_ids||[]){
    const companyEvidence=(company.evidence||[]).find(item=>item.evidence_id===id);
    if(companyEvidence?.source_url){
      links.push(`<a class="evidence-link" href="${esc(companyEvidence.source_url)}" target="_blank" rel="noopener noreferrer" title="${esc((companyEvidence.original_quote||'').slice(0,240))}">公司官方披露 · ${esc(companyEvidence.page_or_section_locator||id)}</a>`);
      continue;
    }
    let eventEvidence=null;
    for(const timelineNode of event.timeline||[]){
      eventEvidence=(timelineNode.evidence||[]).find(item=>item.source_id===id||item.evidence_id===id);
      if(eventEvidence)break;
    }
    if(eventEvidence?.url){
      links.push(`<a class="evidence-link" href="${esc(eventEvidence.url)}" target="_blank" rel="noopener noreferrer">事件官方证据 · ${esc(eventEvidence.publisher||id)}</a>`);
    }else{
      links.push(`<span class="chip">数据引用 ${esc(id)}</span>`);
    }
  }
  return links.length?`<span class="chips">${links.join('')}</span>`:'';
}
function mechanismChainHtml(company,event){
  const chain=company.mechanism_chain||{};
  if(!chain.nodes?.length)return '<div class="empty">公司专属经营机制链待生成。</div>';
  const timelineNode=(event.timeline||[]).find(item=>item.fast_node_id===chain.timeline_node_id)||{};
  const flow=chain.nodes.map((node,index)=>{
    const directionMeta=node.node_type==='DIRECTION_ASSESSMENT'
      ?`<span class="chips"><span class="chip">即时 ${esc(direction(chain.horizon_directions?.IMMEDIATE))}</span><span class="chip">短期 ${esc(direction(chain.horizon_directions?.SHORT_TERM))}</span><span class="chip">中期 ${esc(direction(chain.horizon_directions?.MEDIUM_TERM))}</span></span>`
      :'';
    const timeMeta=node.node_type==='EVENT_FACT'
      ?`<small>发生时间：${esc(timelineNode.occurred_at||'时间待补')} · 锚点：${esc(chain.timeline_node_id)}</small>`
      :'';
    return `<div class="mechanism-step"><div class="mechanism-index"><span>${index+1}</span></div><div class="mechanism-copy"><b>${esc(mechanismLabels[node.node_type]||node.node_type)}</b><p>${esc(node.statement)}</p>${timeMeta}${directionMeta}${chainEvidenceHtml(node,company,event)}</div></div>`;
  }).join('');
  const metrics=(chain.operating_metrics||[]).map(item=>`<span class="chip">${esc(item.name)} · 单位 ${esc(item.unit)}</span>`).join('');
  return `<div class="mechanism-summary"><p>主链从事件事实连续落到公司经营与价格验证，宏观边仅保留为技术血缘。</p><span class="chip warn">${esc(status(chain.review_status))}</span></div><div class="mechanism-flow">${flow}</div><div class="mechanism-meta"><div><b>可观测指标</b><br>${metrics||'指标待补'}</div><div><b>生效条件</b><br>${esc((chain.conditions||[]).join('；')||'待补')}</div><div><b>失效条件</b><br>${esc((chain.invalidation_conditions||[]).join('；')||'待补')}</div></div>`;
}
function closureMatrix(event){
  const header=closureGates.map(([label])=>`<th>${esc(label)}</th>`).join('');
  const rows=event.companies.map(company=>{
    const blockers=company.completion?.blockers||[];
    const gates=closureGates.map(([,codes])=>{
      const open=codes.some(code=>blockers.includes(code));
      return `<td class="${open?'gate-open':'gate-ready'}">${open?'待补':'候选材料具备'}</td>`;
    }).join('');

function renderMain(){const event=currentEvent();if(!state.companyId&&event.companies.length)state.companyId=event.companies[0].company_id;document.getElementById('main').innerHTML=`<section class="hero"><div><span class="eyebrow">${event.event_id.toUpperCase()} · 高质量候选链</span><h1>${esc(event.title)}</h1><p>证据时间线 → 动态传导链 → 行业 → 公司业务暴露 → 方向判断 → 价格窗口 → 相对收益 → 混杂与反证</p></div><div class="hero-status"><b>正式发布：未就绪</b><span>AI 方向与公司公告均需人工复核</span></div></section><div class="metrics"><div class="metric"><b>${event.summary.timeline_count}</b><span>时间线节点</span></div><div class="metric"><b>${event.summary.path_count}</b><span>传导候选边</span></div><div class="metric"><b>${event.industries.length}</b><span>关联行业</span></div><div class="metric"><b>${event.summary.company_count}</b><span>公司评估</span></div></div><div class="notice">本页为候选研究数据。证据存在不等于因果已确认；行业基准、停复牌和公司公告正文的缺口会原样显示。</div><section class="section"><div class="section-head"><h2>事件时间线</h2><p>点击节点联动其锚定的传导边</p></div><div class="timeline">${renderTimeline(event)}</div></section><section class="section"><div class="section-head"><h2>动态传导链</h2><p>即时、短期与中期方向均保持独立审核状态</p></div><div class="transmission-toolbar"><div class="transmission-tabs" role="tablist" aria-label="\u4f20\u5bfc\u94fe\u89c6\u56fe"><button class="transmission-tab ${state.transmissionMode==='operating'?'active':''}" data-transmission-mode="operating" role="tab" aria-selected="${state.transmissionMode==='operating'}">\u7ecf\u8425\u5f71\u54cd\u94fe</button><button class="transmission-tab ${state.transmissionMode==='macro'?'active':''}" data-transmission-mode="macro" role="tab" aria-selected="${state.transmissionMode==='macro'}">\u5b8f\u89c2\u5e02\u573a\u94fe</button></div><button class="plain-button" id="show-all-paths">\u663e\u793a\u5168\u90e8\u8def\u5f84</button></div><div class="path-list">${renderTransmission(event)}</div></section><section class="section"><div class="section-head"><h2>行业影响</h2><p>点击行业筛选公司</p></div><div class="industry-strip">${renderIndustries(event)}</div></section><section class="section"><div class="section-head"><h2>公司影响</h2><p>每个事件固定三家公司，禁止事后按股价挑选</p></div><div class="company-grid">${renderCompanies(event)}</div>${companyDetail(event)}</section><footer class="footer">数据版本 ${esc(DATA.dataset_version)} · formal_ready=false · SHA 门禁暂缓 · 页面不包含隐藏评测标签</footer>`;bind(event)}

<script>
function confounderHtml(company){
  const record=company.confounders||{};
  const argument=company.confounder_argument||{};
  const search=company.confounder_search_audit||{};
  const trading=company.trading_status_review||{};
  const counter=company.counterevidence_review||{};
  const bodies=company.announcement_body_reviews||[];
  const stateName=record.display_state||argument.display_state||'UNRESOLVED';
  const stateTitle=stateName==='REVIEWED'?'完整审核论证':stateName==='SEARCH_COMPLETE_NO_MATERIAL_CONFOUNDER'?'完成负向检索，未发现实质混杂':'仍有证据缺口';
  const unresolved=(record.unresolved_reasons||[]).map(item=>`<li>${esc(item)}</li>`).join('');
  const argumentHtml=argument.argument_zh?`<div class="confounder-argument"><b>${esc(stateTitle)} · ${esc(status(record.overall_grade))}</b><p>${esc(argument.argument_zh)}</p></div>`:`<div class="empty">缺少映射级混杂论证。</div>`;
  const reviewed=bodies.filter(item=>['RELEVANT','MINOR_RELEVANCE'].includes(item.relevance_decision));
  const bodyHtml=reviewed.length?reviewed.map(item=>`<div class="confounder-item"><b>${esc(item.announcement_title)}</b><p>${esc(item.original_quote)}</p><small>${esc(item.body_locator)} · 首次公开 ${esc(item.first_public_at)} · 影响窗口 ${esc((item.affected_windows||[]).join('、'))} · ${esc(status(item.severity_candidate))}</small><br><a class="evidence-link" href="${esc(item.source_url)}" target="_blank" rel="noopener noreferrer">打开官方公告正文</a></div>`).join(''):`<div class="negative-audit"><b>负向检索依据</b><p>${esc(search.negative_result_basis||'固定分类检索已完成，未形成正文级实质候选。')}</p><small>${esc(search.window_start)} 至 ${esc(search.window_end)} · ${fmt(search.title_count)} 条标题 · ${fmt(search.candidate_count)} 条正文候选 · ${esc(status(search.search_status))}</small></div>`;
  const windows=trading.window_reviews||{};
  const tradingHtml=`<div class="confounder-meta"><b>可交易性核验</b><p>${esc(trading.verification_basis||'核验依据待补')}</p><span class="chips">${Object.entries(windows).map(([key,value])=>`<span class="chip">${esc(key)} ${esc(value.actual_date||'日期缺失')} · ${esc(status(value.status))}</span>`).join('')}</span></div>`;
  const counterHtml=(counter.findings||[]).slice(0,4).map(item=>`<div class="counter-item"><b>${esc(item.claim_zh)}</b><p>${esc(item.original_quote)}</p><small>${esc(item.locator)} · 影响期限 ${esc((item.affected_horizons||[]).join('、'))}</small><br><a class="evidence-link" href="${esc(item.source_url)}" target="_blank" rel="noopener noreferrer">打开反证来源</a></div>`).join('')||`<div class="negative-audit"><b>公司级反证负向检索</b><p>${esc(counter.negative_search_basis||'检索记录缺失')}</p></div>`;
  const unresolvedHtml=unresolved?`<div class="notice"><b>未关闭项目</b><ul>${unresolved}</ul></div>`:'';
  return `${argumentHtml}${unresolvedHtml}<div class="confounder-subhead">公告正文与检索审计</div>${bodyHtml}${tradingHtml}<div class="confounder-subhead">公司级反证</div>${counterHtml}<details class="raw-details"><summary>检索与审核技术详情</summary><div class="raw-details-body"><p><code>${esc(search.search_audit_id||'search-audit-missing')}</code></p><p><code>${esc(trading.trading_review_id||'trading-review-missing')}</code></p><p><code>${esc(counter.counterevidence_review_id||'counter-review-missing')}</code></p></div></details>`;
}
renderMain();
</script>

<script>
state.industryMappingId=null;
state.industryTier='CORE_DIRECT';
const industryTierLabels={CORE_DIRECT:'直接影响',SECOND_ORDER:'二阶传导',CONDITIONAL:'条件性影响'};
const industryNodeLabels={
  EVENT_FACT:'事件事实',
  BEHAVIOR_OR_POLICY_CHANGE:'行为或政策变化',
  OBSERVABLE_DRIVER:'可观测驱动',
  INDUSTRY_OPERATING_VARIABLE:'行业经营变量',
  INDUSTRY_REVENUE_OR_COST_VARIABLE:'行业收入或成本变量',
  DIRECTION_ASSESSMENT:'三期限方向',
  PRICE_CONFOUNDER_AND_COUNTEREVIDENCE:'价格、混杂与反证验证'
};
const industryWindowLabels=[['T_MINUS_1','T-1'],['T0','T0'],['D1','D1'],['D3','D3'],['D5','D5'],['D20','D20'],['M3','M3']];

function industryImpact(event,mappingId){
  return (event.industry_impacts||[]).find(function(row){return row.event_industry_mapping_id===mappingId})||null;
}
function selectedIndustryImpact(event){
  const visible=(event.industry_impacts||[]).filter(function(row){return row.impact_tier===state.industryTier});
  return industryImpact(event,state.industryMappingId)||visible[0]||(event.industry_impacts||[])[0]||null;
}
function industryDirectionChips(values){
  values=values||{};
  return '<span class="chips"><span class="chip">即时 '+esc(direction(values.IMMEDIATE))+'</span><span class="chip">短期 '+esc(direction(values.SHORT_TERM))+'</span><span class="chip">中期 '+esc(direction(values.MEDIUM_TERM))+'</span></span>';
}
function industryEvidenceLinks(impact){
  const rows=impact.evidence||[];
  if(!rows.length)return '<span class="chip warn">机制支持证据待补</span>';
  return rows.map(function(row){
    return '<a class="evidence-link" href="'+esc(row.source_url)+'" target="_blank" rel="noopener noreferrer">'+esc(row.publisher||row.title||row.evidence_id)+' · '+esc((row.locator||{}).value||'定位待补')+'</a>';
  }).join(' · ');
}
function industryFlowSteps(chain){
  return (chain.nodes||[]).map(function(node,index){
    const evidence=(node.evidence_ids||[]).length?'有引用':'支持证据待补';
    const kind=node.claim_kind==='SOURCE_FACT'?'来源事实':'研究推断';
    return '<div class="transmission-step"><small>'+(index+1)+' · '+esc(industryNodeLabels[node.node_type]||node.node_type)+'</small><b>'+esc(node.statement_zh||'内容待补')+'</b><p>'+kind+' · '+evidence+'</p></div>';
  }).join('');
}
function industryGateSummary(impact){
  const completion=impact.completion||{};
  const gate=completion.gate_statuses||{};
  const coverage=completion.evidence_coverage||{};
  const evidenced=coverage.evidenced_node_count??0;
  const required=coverage.required_node_count??7;
  const companyCount=impact.company_count??(impact.company_links||[]).length;
  return '<div class="industry-gates"><div class="industry-gate"><b>机制证据 '+esc(evidenced)+'/'+esc(required)+'</b>'+esc(status(gate.mechanism_evidence||'DATA_PENDING'))+'</div><div class="industry-gate"><b>驱动数据</b>'+esc(status(gate.driver_data||'DATA_PENDING'))+'</div><div class="industry-gate"><b>行情窗口</b>'+esc(status(gate.market_window||'DATA_PENDING'))+'</div><div class="industry-gate"><b>公司样本 '+esc(companyCount)+' 家</b>'+esc(status(gate.company_sample||'DATA_PENDING'))+'</div></div>';
}
function renderIndustryPaths(event){
  const rows=event.industry_impacts||[];
  const tiers=['CORE_DIRECT','SECOND_ORDER','CONDITIONAL'];
  if(!rows.length)return '<div class="empty">当前事件尚无行业板块链候选。</div>';
  const groups=tiers.map(function(tier){
    const tierRows=rows.filter(function(row){return row.impact_tier===tier});
    if(!tierRows.length)return '';
    const cards=tierRows.map(function(impact){
      const chain=impact.mechanism_chain||{};
      const directions=chain.horizon_directions||{};
      const selected=state.industryMappingId===impact.event_industry_mapping_id?' active':'';
      const anchorMatch=!state.nodeId||impact.anchor_node_id===state.nodeId;
      const anchorClass=anchorMatch?'':' anchor-muted';
      const anchorLabel=state.nodeId?(anchorMatch?'匹配当前时间点':'同事件其他时间点'):'事件主锚点';
      return '<article class="transmission-card industry-chain-card'+selected+anchorClass+'"><header class="transmission-card-head"><div><span class="eyebrow">'+esc(industryTierLabels[impact.impact_tier]||impact.impact_tier)+' · '+esc(impact.classification_edition)+'</span><h3>'+esc(impact.event_title_zh)+' → '+esc(impact.display_name_zh)+'</h3><p>'+esc(impact.behavior_change_zh)+'，经由“'+esc(impact.observable_driver_zh)+'”传导至行业经营与财务变量。</p></div><div class="transmission-actions"><span class="chip">'+esc(anchorLabel)+'</span><span class="chip warn">'+esc(status(impact.review_status))+'</span><button class="link-button" data-industry-detail="'+esc(impact.event_industry_mapping_id)+'">查看行业详情</button></div></header><div class="transmission-flow-wrap"><div class="transmission-flow industry-chain-flow">'+industryFlowSteps(chain)+'</div></div><div class="transmission-card-meta"><div><b>即时 / 短期 / 中期</b>'+esc(direction(directions.IMMEDIATE))+' / '+esc(direction(directions.SHORT_TERM))+' / '+esc(direction(directions.MEDIUM_TERM))+'</div><div><b>生效条件</b>'+esc((chain.conditions_zh||[]).join('；')||'待补')+'</div><div><b>失效条件</b>'+esc((chain.invalidation_conditions_zh||[]).join('；')||'待补')+'</div></div><div class="transmission-evidence"><b>事件锚点证据：</b> '+industryEvidenceLinks(impact)+'<p class="industry-evidence-note">标记为“研究推断”的机制节点仍需单独补充支持证据，不把事件锚点来源扩张为整条链的证明。</p></div></article>';
    }).join('');
    return '<section class="industry-chain-group" data-industry-chain-group="'+tier+'"><div class="industry-chain-group-head"><h3>'+esc(industryTierLabels[tier])+'</h3><span>'+tierRows.length+' 条行业分支 · 全部保持可见</span></div>'+cards+'</section>';
  }).join('');
  return '<div class="transmission-stack">'+groups+'</div>';
}
const baseRenderTransmission=renderTransmission;
renderTransmission=function(event){
  return state.transmissionMode==='industry'?renderIndustryPaths(event):baseRenderTransmission(event);
};

renderIndustries=function(event){
  const rows=event.industry_impacts||[];
  const tiers=['CORE_DIRECT','SECOND_ORDER','CONDITIONAL'];
  const tabs=tiers.map(function(tier){
    const count=rows.filter(function(row){return row.impact_tier===tier}).length;
    return '<button class="industry-tier-button '+(state.industryTier===tier?'active':'')+'" data-industry-tier="'+tier+'">'+industryTierLabels[tier]+' · '+count+'</button>';
  }).join('');
  const groups=tiers.map(function(tier){
    const tierRows=rows.filter(function(row){return row.impact_tier===tier});
    const cards=tierRows.map(function(impact){
      return '<button class="industry-impact-button '+(state.industryMappingId===impact.event_industry_mapping_id?'active':'')+'" data-industry-mapping="'+esc(impact.event_industry_mapping_id)+'" data-tier="'+esc(impact.impact_tier)+'"><span class="eyebrow">'+esc(industryTierLabels[impact.impact_tier])+' · 申万一级 '+esc(impact.sw1_id)+'</span><h3>'+esc(impact.display_name_zh)+'</h3><p>'+esc(impact.observable_driver_zh)+' → '+esc(impact.industry_operating_variable_zh)+'</p>'+industryGateSummary(impact)+'<small>'+esc(status((impact.completion||{}).completion_status))+' · 仍待人工审核</small></button>';
    }).join('');
    return '<section class="industry-tier-group" data-industry-group="'+tier+'"><div class="industry-tier-group-head"><h3>'+esc(industryTierLabels[tier])+'</h3><p>'+tierRows.length+' 个申万一级行业 · 默认全部展开</p></div><div class="industry-card-grid">'+(cards||'<div class="empty">该层级暂无行业候选。</div>')+'</div></section>';
  }).join('');

const baseCompanyDetailForIndustry=companyDetail;
companyDetail=function(event){
  const impact=industryImpact(event,state.industryMappingId);
  if(impact){
    const companyIds=(impact.company_links||[]).map(function(row){return row.company_id});
    if(!companyIds.length){
      return '<div class="detail"><div class="empty">公司样本待补：当前行业尚未连接公司业务暴露样本，不展示其他行业公司的详情。</div></div>';
    }
  }
  return baseCompanyDetailForIndustry(event);

function industryChart(impact){
  const observations=(((impact.market_window||{}).continuous_window||{}).observations)||[];
  const gap=((impact.market_window||{}).data_availability_gap)||{};
  const points=observations.map(function(row,index){
    return {index:index,industry:row.industry_normalized??row.normalized_industry??((row.industry||{}).normalized_value)??null,market:row.market_normalized??row.normalized_market??((row.market||{}).normalized_value)??null};
  });
  const values=points.flatMap(function(row){return [row.industry,row.market]}).filter(function(value){return value!=null&&Number.isFinite(Number(value))});
  if(!values.length)return '<div class="industry-data-state"><div><b>T-20 至 D20 行业走势待补</b><span>'+esc(status(((impact.market_window||{}).window_status)||'DATA_PENDING'))+'</span><p><b>数据库可用性审计</b>'+esc(gap.checked_at||'检查时间待补')+'；当前许可库未发现申万一级与沪深300历史日线。</p><p>缺口代码：'+esc((gap.reason_codes||[]).join('、')||'未登记')+'。缺失值保持为空，不补零，也不使用事件后行情决定行业入选或方向。</p></div></div>';
  let min=Math.min.apply(null,values),max=Math.max.apply(null,values);
  if(max-min<2){min-=1;max+=1}
  const x=function(index){return 55+index*(660/Math.max(1,points.length-1))};
  const y=function(value){return 215-(Number(value)-min)/(max-min)*175};
  const poly=function(key){return points.filter(function(row){return row[key]!=null}).map(function(row){return x(row.index)+','+y(row[key])}).join(' ')};
  return '<svg viewBox="0 0 760 250" role="img" aria-label="行业指数与沪深300 T-20 至 D20 标准化走势"><g stroke="#e1e5e2" stroke-width="1"><line x1="55" y1="40" x2="715" y2="40"/><line x1="55" y1="127" x2="715" y2="127"/><line x1="55" y1="215" x2="715" y2="215"/></g><polyline fill="none" stroke="#a63f35" stroke-width="3" points="'+poly('industry')+'"/><polyline fill="none" stroke="#236b66" stroke-width="3" points="'+poly('market')+'"/><text x="55" y="238" font-size="11" fill="#667175">T-20</text><text x="375" y="238" text-anchor="middle" font-size="11" fill="#667175">T0</text><text x="715" y="238" text-anchor="end" font-size="11" fill="#667175">D20</text><text x="8" y="44" font-size="11" fill="#667175">'+max.toFixed(1)+'</text><text x="8" y="218" font-size="11" fill="#667175">'+min.toFixed(1)+'</text></svg>';
}
function industryWindowTable(impact){
  const fixed=((impact.market_window||{}).fixed_windows)||{};
  return industryWindowLabels.map(function(item){
    const key=item[0],label=item[1],row=fixed[key]||{};
    return '<tr><td>'+label+'</td><td>'+esc(row.actual_date||'数据待补')+'</td><td>'+fmt(row.industry_close??row.industry_value)+'</td><td>'+pct(row.industry_return)+'</td><td>'+fmt(row.market_close??row.market_value)+'</td><td>'+pct(row.market_relative_return)+'</td></tr>';
  }).join('');
}
function industryMechanismDetail(chain){
  return (chain.nodes||[]).map(function(node,index){
    const kind=node.claim_kind==='SOURCE_FACT'?'来源事实':'研究推断';
    return '<div class="mechanism-step"><div class="mechanism-index"><span>'+(index+1)+'</span></div><div class="mechanism-copy"><b>'+esc(industryNodeLabels[node.node_type]||node.node_type)+'</b><p>'+esc(node.statement_zh||'内容待补')+'</p><small>'+kind+' · '+esc((node.evidence_ids||[]).join('、')||'支持证据待补')+'</small></div></div>';
  }).join('');
}
function industryDetail(event){
  const impact=selectedIndustryImpact(event);
  if(!impact)return '<div class="detail industry-detail"><div class="empty">行业影响详情待生成。</div></div>';
  state.industryMappingId=impact.event_industry_mapping_id;
  const chain=impact.mechanism_chain||{};
  const driver=((impact.driver||{}).primary_driver)||{};
  const companies=impact.company_links||[];
  const evidence=(impact.evidence||[]).map(function(row){
    return '<div class="evidence-item"><b>'+esc(row.title||row.evidence_id)+'</b><p>'+esc(row.original_quote||row.evidence_summary||'原文引文待补')+'</p><small>'+esc(row.publisher)+' · '+esc(row.published_at)+' · '+esc(row.availability_scope)+' · '+esc((row.locator||{}).value||'定位待补')+'</small><br><a class="evidence-link" href="'+esc(row.source_url)+'" target="_blank" rel="noopener noreferrer">打开官方证据</a></div>';
  }).join('')||'<div class="empty">事件锚点证据待补。</div>';
  const companyLinks=companies.map(function(row){
    return '<button class="industry-company-link" data-industry-company="'+esc(row.company_id)+'">'+esc(row.company_name)+' · '+esc(row.company_code)+'</button>';
  }).join('')||'<div class="empty">公司样本待补：行业候选保留，但尚未连接到公司业务暴露样本。</div>';
  const labels=(impact.segment_labels_zh||[]).map(function(label){return '<span class="chip">'+esc(label)+'</span>'}).join('');
  const counter=(chain.counterevidence_zh||impact.counterevidence_zh||[]).join('；')||'反证待补';
  return '<div class="detail industry-detail"><div class="detail-head"><div><span class="eyebrow">'+esc(impact.event_industry_mapping_id)+' · '+esc(industryTierLabels[impact.impact_tier])+'</span><h3>行业影响详情 · '+esc(impact.display_name_zh)+'</h3><p>'+esc(impact.event_title_zh)+' → '+esc(impact.behavior_change_zh)+' → '+esc(impact.observable_driver_zh)+'</p></div><span class="chip warn">'+esc(status(impact.review_status))+'</span></div><div class="chips"><span class="chip">'+esc(impact.classification_edition)+' · '+esc(impact.sw1_id)+'</span>'+labels+'<span class="chip warn">'+esc((impact.completion||{}).completion_status||'OPEN')+'</span></div><div class="industry-fact-box"><b>已验证事件锚点</b><p>'+esc(impact.anchor_fact)+'</p><small>发生：'+esc(impact.anchor_occurred_at)+' · 首次公开：'+esc(impact.anchor_first_public_at)+' · '+industryEvidenceLinks(impact)+'</small></div><h4>七步行业机制链</h4><div class="mechanism-flow">'+industryMechanismDetail(chain)+'</div><div class="industry-research-box"><div><b>三期限方向</b>'+industryDirectionChips(chain.horizon_directions)+'</div><div><b>生效条件</b><br>'+esc((chain.conditions_zh||[]).join('；')||'待补')+'</div><div><b>失效条件</b><br>'+esc((chain.invalidation_conditions_zh||[]).join('；')||'待补')+'</div></div><div class="industry-detail-layout"><div><h4>T-20 至 D20 行业与大盘折线图</h4><div class="legend"><span><i style="background:#a63f35"></i>'+esc(impact.display_name_zh)+'（T-1=100）</span><span><i style="background:#236b66"></i>沪深300（T-1=100）</span></div><div class="chart-wrap">'+industryChart(impact)+'</div></div><div><h4>驱动变量</h4><p><b>'+esc(driver.name_zh||impact.observable_driver_zh)+'</b></p><p>单位：'+esc(driver.unit_zh||impact.driver_unit_zh||'待补')+'；频率：'+esc(driver.frequency||'UNKNOWN')+'；数据状态：'+esc(status(driver.source_status||'DATA_PENDING'))+'</p><p>'+esc(driver.selection_basis_zh||'驱动变量按事件前机制预先指定。')+'</p><h4>经营与财务变量</h4><p><b>经营：</b>'+esc(impact.industry_operating_variable_zh)+'</p><p><b>收入/成本：</b>'+esc(impact.industry_financial_variable_zh)+'</p></div></div><h4>固定行情窗口</h4><div class="table-wrap"><table class="market-table"><thead><tr><th>窗口</th><th>实际交易日</th><th>行业指数</th><th>行业收益</th><th>沪深300</th><th>相对收益</th></tr></thead><tbody>'+industryWindowTable(impact)+'</tbody></table></div><h4>证据来源</h4><div class="evidence-list">'+evidence+'</div><h4>混杂、竞争解释与反证</h4><div class="notice">'+esc(counter)+'。价格仅用于验证，不用于选择行业或生成方向。</div><h4>关联公司样本</h4><div class="industry-company-links">'+companyLinks+'</div><details class="raw-details"><summary>技术详情与完成门禁</summary><div class="raw-details-body"><p><code>'+esc(impact.event_industry_mapping_id)+'</code></p><p>主驱动：<code>'+esc(driver.driver_series_id||'DATA_PENDING')+'</code></p><p>行业窗口：<code>'+esc(((impact.market_window||{}).industry_market_window_id)||'DATA_PENDING')+'</code></p><p>阻塞项：'+esc(((impact.completion||{}).blockers||[]).join('、')||'无')+'</p><p>formal_ready=false · sha_gate=DEFERRED · review_status='+esc(impact.review_status)+'</p></div></details></div>';
}

const baseRenderMainForIndustry=renderMain;
renderMain=function(){
  const event=currentEvent();
  const impacts=event.industry_impacts||[];
  if(!impacts.some(function(row){return row.event_industry_mapping_id===state.industryMappingId})){
    const first=impacts.find(function(row){return row.impact_tier===state.industryTier})||impacts[0];
    state.industryMappingId=first?first.event_industry_mapping_id:null;
    state.industryId=first?first.sw1_id:null;
  }
  const activeImpact=industryImpact(event,state.industryMappingId);
  const activeCompanyIds=activeImpact?(activeImpact.company_links||[]).map(function(row){return row.company_id}):[];
  if(activeImpact){
    if(activeCompanyIds.length&&!activeCompanyIds.includes(state.companyId))state.companyId=activeCompanyIds[0];
    if(!activeCompanyIds.length)state.companyId='__NO_INDUSTRY_COMPANY__';
  }
  baseRenderMainForIndustry();
  const tabs=document.querySelector('.transmission-tabs');
  if(tabs&&!tabs.querySelector('[data-transmission-mode="industry"]')){
    const macro=tabs.querySelector('[data-transmission-mode="macro"]');
    if(macro)macro.insertAdjacentHTML('beforebegin','<button class="transmission-tab '+(state.transmissionMode==='industry'?'active':'')+'" data-transmission-mode="industry" role="tab" aria-selected="'+(state.transmissionMode==='industry')+'">行业板块链</button>');
  }
  const industryHeading=Array.from(document.querySelectorAll('.section-head h2')).find(function(node){return node.textContent.trim()==='行业影响'});
  const section=industryHeading?industryHeading.closest('.section'):null;
  if(section)section.insertAdjacentHTML('beforeend',industryDetail(event));
  document.querySelectorAll('[data-transmission-mode]').forEach(function(button){button.onclick=function(){state.transmissionMode=button.dataset.transmissionMode;renderMain()}});
  document.querySelectorAll('[data-industry-tier]').forEach(function(button){button.onclick=function(){
    state.industryTier=button.dataset.industryTier;
    renderMain();
    requestAnimationFrame(function(){
      const group=document.querySelector('[data-industry-group="'+state.industryTier+'"]');
      if(group)group.scrollIntoView({behavior:'smooth',block:'start'});
    });
  }});
  document.querySelectorAll('[data-industry-mapping],[data-industry-detail]').forEach(function(button){button.onclick=function(){
    const mappingId=button.dataset.industryMapping||button.dataset.industryDetail;
    const impact=industryImpact(event,mappingId);
    state.industryMappingId=mappingId;
    state.industryTier=impact?impact.impact_tier:state.industryTier;
    state.industryId=impact?impact.sw1_id:null;
    if(button.dataset.industryDetail)state.transmissionMode='industry';
    state.companyId=null;
    renderMain();
    requestAnimationFrame(function(){const detail=document.querySelector('.industry-detail');if(detail)detail.scrollIntoView({behavior:'smooth',block:'start'})});
  }});
  document.querySelectorAll('[data-industry-company]').forEach(function(button){button.onclick=function(){
    state.companyId=button.dataset.industryCompany;
    renderMain();
    requestAnimationFrame(function(){const grid=document.querySelector('.company-grid');if(grid)grid.scrollIntoView({behavior:'smooth',block:'start'})});
  }});
};
renderMain();
</script>

<script>
function closureLocator(row){
  const value=row&&row.locator;
  if(value&&typeof value==='object')return value.value||value.label||'定位待补';
  return value||'定位待补';
}
function closureStatementClass(value){
  if(value==='SOURCE_FACT')return {label:'来源事实',className:'source'};
  if(value==='CALCULATED_FACT')return {label:'计算事实',className:'calculated'};
  return {label:'研究推断',className:'inference'};
}
industryEvidenceLinks=function(impact){
  const rows=impact.evidence||[];
  if(!rows.length)return '<span class="chip warn">机制支持证据待核验</span>';
  return rows.map(function(row){
    return '<a class="evidence-link" href="'+esc(row.source_url)+'" target="_blank" rel="noopener">'+esc(row.publisher||row.title||row.evidence_id)+' · 查看原文</a>';
  }).join(' · ');
};
industryFlowSteps=function(chain){
  return (chain.nodes||[]).map(function(node,index){
    const kind=closureStatementClass(node.statement_class);
    const evidenceCount=(node.evidence||[]).length;
    const evidenceText=node.statement_class==='RESEARCH_INFERENCE'?'明确条件与失效边界':(evidenceCount?'已连接 '+evidenceCount+' 条原文':'证据待核验');
    return '<div class="transmission-step"><small>'+(index+1)+' · '+esc(industryNodeLabels[node.node_type]||node.node_type)+'</small><b>'+esc(node.statement_zh||'内容待补')+'</b><span class="mechanism-class '+kind.className+'">'+kind.label+'</span><p>'+evidenceText+'</p></div>';
  }).join('');
};
function closureEvidenceCard(row){
  return '<div class="node-evidence"><b>'+esc(row.title||row.evidence_id)+'</b><p>“'+esc(row.original_quote||'原文引文待核验')+'”</p><small>'+esc(row.publisher)+' · '+esc(row.published_at)+' · '+esc(row.availability_scope)+' · '+esc(closureLocator(row))+'</small><a class="evidence-link" href="'+esc(row.source_url)+'" target="_blank" rel="noopener">查看原文</a></div>';
}
industryMechanismDetail=function(chain){
  return (chain.nodes||[]).map(function(node,index){
    const kind=closureStatementClass(node.statement_class);
    const evidence=(node.evidence||[]).map(closureEvidenceCard).join('');
    const pending=node.statement_class==='SOURCE_FACT'&&!evidence?'<div class="empty">证据待核验：'+esc((node.missing_evidence_ids||[]).join('、')||node.evidence_status||'EVIDENCE_PENDING')+'</div>':'';
    const inference=node.statement_class==='RESEARCH_INFERENCE'?'<div class="inference-boundary"><b>推断前提：</b>'+esc((node.premise_node_ids||[]).join('、'))+'<br><b>生效条件：</b>'+esc(node.condition_zh||'待补')+'<br><b>失效条件：</b>'+esc(node.invalidation_zh||'待补')+'</div>':'';
    return '<div class="mechanism-step"><div class="mechanism-index"><span>'+(index+1)+'</span></div><div class="mechanism-copy"><b>'+esc(industryNodeLabels[node.node_type]||node.node_type)+'</b><p>'+esc(node.statement_zh||'内容待补')+'</p><span class="mechanism-class '+kind.className+'">'+kind.label+'</span><div class="node-evidence-list">'+evidence+pending+'</div>'+inference+'</div></div>';
  }).join('');
};
function setIndustryChartMode(button,mode){
  const root=button.closest('.industry-chart');
  if(!root)return;
  root.querySelectorAll('[data-chart-mode]').forEach(function(item){item.classList.toggle('active',item.dataset.chartMode===mode)});
  root.querySelectorAll('[data-chart-view]').forEach(function(item){item.hidden=item.dataset.chartView!==mode});
}
function closureChartSvg(points,driverPoints,mode,t0Index){
  const keyIndustry=mode==='raw'?'industry_value':'industry_normalized';
  const keyMarket=mode==='raw'?'market_value':'market_normalized';
  const values=points.flatMap(function(row){return [row[keyIndustry],row[keyMarket]]}).filter(function(value){return value!=null&&Number.isFinite(Number(value))});
  if(!values.length)return '';
  let min=Math.min.apply(null,values),max=Math.max.apply(null,values);
  if(max===min){min-=1;max+=1}
  const x=function(index){return 58+index*(650/Math.max(1,points.length-1))};
  const y=function(value){return 210-(Number(value)-min)/(max-min)*165};
  const poly=function(key){return points.map(function(row,index){return row[key]==null?null:x(index)+','+y(row[key])}).filter(Boolean).join(' ')};
  const numericDriver=driverPoints.filter(function(row){return row.value!=null&&Number.isFinite(Number(row.value))});
  let driverMin=numericDriver.length?Math.min.apply(null,numericDriver.map(function(row){return Number(row.value)})):0;
  let driverMax=numericDriver.length?Math.max.apply(null,numericDriver.map(function(row){return Number(row.value)})):1;
  if(driverMin===driverMax){driverMin-=1;driverMax+=1}
  const driverY=function(value){return 210-(Number(value)-driverMin)/(driverMax-driverMin)*165};
  const circles=numericDriver.map(function(row){return '<circle cx="'+x(row.index)+'" cy="'+driverY(row.value)+'" r="4" fill="#9a721e"><title>'+esc(row.metric_code)+' '+esc(row.value)+' '+esc(row.unit)+'</title></circle>'}).join('');
  const t0x=x(Math.max(0,t0Index));
  return '<svg viewBox="0 0 760 250" role="img" aria-label="行业、沪深300与主驱动走势"><g stroke="#e1e5e2"><line x1="58" y1="45" x2="708" y2="45"/><line x1="58" y1="127" x2="708" y2="127"/><line x1="58" y1="210" x2="708" y2="210"/></g><line x1="'+t0x+'" y1="35" x2="'+t0x+'" y2="218" stroke="#667175" stroke-dasharray="4 4"/><polyline fill="none" stroke="#a63f35" stroke-width="3" points="'+poly(keyIndustry)+'"/><polyline fill="none" stroke="#236b66" stroke-width="3" points="'+poly(keyMarket)+'"/>'+circles+'<text x="'+t0x+'" y="232" text-anchor="middle" font-size="11" fill="#667175">T0</text><text x="58" y="242" font-size="10" fill="#667175">'+esc(points[0].actual_date||'T-20')+'</text><text x="708" y="242" text-anchor="end" font-size="10" fill="#667175">'+esc(points[points.length-1].actual_date||'D20')+'</text><text x="6" y="48" font-size="10" fill="#667175">'+max.toFixed(2)+'</text><text x="6" y="213" font-size="10" fill="#667175">'+min.toFixed(2)+'</text><text x="754" y="48" text-anchor="end" font-size="10" fill="#9a721e">'+driverMax.toFixed(2)+'</text><text x="754" y="213" text-anchor="end" font-size="10" fill="#9a721e">'+driverMin.toFixed(2)+'</text></svg>';
}
industryChart=function(impact){
  const marketWindow=impact.market_window||{};
  const continuous=marketWindow.continuous_window||[];
  const points=Array.isArray(continuous)?continuous:(continuous.observations||[]);
  const driver=impact.driver||{};
  const driverRows=driver.observations||[];
  if(!points.length){
    return '<div class="industry-data-state"><div><b>T-20 至 D20 行业走势待补</b><span>'+esc(status(marketWindow.window_status||'DATA_PENDING'))+'</span><p>缺口代码：'+esc(marketWindow.pending_reason||'MARKET_SERIES_NOT_AVAILABLE')+'。缺失值保持为空，不补零。</p></div></div>';
  }
  const t0Date=((marketWindow.t0_alignment||{}).T0);
  const t0Index=Math.max(0,points.findIndex(function(row){return row.actual_date===t0Date}));
  const driverPoints=driverRows.map(function(row){
    const observed=row.observed_at||row.period;
    let index=points.findIndex(function(point){return point.actual_date>=observed});
    if(index<0)index=points.length-1;
    return {...row,index:index};
  });
  return '<div class="industry-chart" data-mode="normalized"><div class="industry-chart-controls"><button class="active" data-chart-mode="normalized" onclick="setIndustryChartMode(this,\'normalized\')">归一化值</button><button data-chart-mode="raw" onclick="setIndustryChartMode(this,\'raw\')">原始值</button></div><div class="industry-chart-view" data-chart-view="normalized">'+closureChartSvg(points,driverPoints,'normalized',t0Index)+'</div><div class="industry-chart-view" data-chart-view="raw" hidden>'+closureChartSvg(points,driverPoints,'raw',t0Index)+'</div></div>';
};
industryWindowTable=function(impact){
  const fixed=((impact.market_window||{}).fixed_windows)||{};
  return industryWindowLabels.map(function(item){
    const key=item[0],label=item[1],row=fixed[key]||{};
    const inputs=row.formula_inputs||{};
    const formula=row.formula||'待补';
    return '<tr><td>'+label+'</td><td>'+esc(row.actual_date||'数据待补')+'</td><td>'+fmt(row.industry_value)+'</td><td>'+pct(row.industry_return)+'</td><td>'+fmt(row.market_value)+'</td><td>'+pct(row.market_return)+'</td><td>'+pct(row.market_relative_return)+'<details class="formula-details"><summary>公式输入</summary><code>'+esc(formula)+'</code><br>'+esc(JSON.stringify(inputs))+'</details></td></tr>';
  }).join('');
};
function closureDriverHtml(driver){
  const observations=(driver.observations||[]).map(function(row){
    const value=row.value==null?'DATA_PENDING':fmt(row.value)+' '+esc(row.unit);
    return '<div class="driver-observation"><span>'+esc(row.observed_at)+' · '+esc(row.metric_code)+'</span><b>'+value+'</b></div>';
  }).join('')||'<div class="empty">驱动观测待补。</div>';
  const selectionBasisLabels={
    PRE_REGISTERED_OPERATING_DRIVER_NOT_SELECTED_BY_PRICE:'经营驱动在事件前预先登记，未按事后价格表现选择'
  };
  const selectionBasis=driver.selection_basis_zh||selectionBasisLabels[driver.selection_basis]||driver.selection_basis||'事件前机制预先指定，未使用事后价格选样。';
  return '<h4>主驱动（右轴）</h4><p><b>'+esc(driver.driver_name_zh||'驱动待补')+'</b></p><p>单位：'+esc(driver.unit_zh||'待补')+'；频率：'+esc(driver.frequency||'UNKNOWN')+'；状态：'+esc(status(driver.source_status||'DATA_PENDING'))+'</p><p>'+esc(selectionBasis)+'</p><div class="driver-observations">'+observations+'</div>';
}
function closureConfounderHtml(chain){
  const rows=chain.confounders||[];
  if(!rows.length)return '<div class="empty">混杂、竞争解释与反证待补。</div>';
  return '<div class="industry-concurrence-list">'+rows.map(function(row){
    const severity=(row.severity||'UNRESOLVED').toLowerCase();
    const counters=(row.counterevidence_zh||[]).map(function(text){return '<li>'+esc(text)+'</li>'}).join('');
    const tests=(row.distinguishing_tests_zh||[]).map(function(text){return '<li>'+esc(text)+'</li>'}).join('');
    const sources=(row.evidence||[]).map(closureEvidenceCard).join('');
    const evidence=sources||'<div class="empty">混杂证据待核验：'+esc(row.missing_evidence_reason||'CONFOUNDER_SOURCE_NOT_VERIFIED')+'</div>';
    const kind=closureStatementClass(row.statement_class||'RESEARCH_INFERENCE');
    return '<article class="industry-concurrence '+severity+'"><h5>'+esc(row.event_zh)+' <span class="chip warn">'+esc(row.severity)+'</span> <span class="mechanism-class '+kind.className+'">'+kind.label+'</span> '+(row.challenge_set_only?'<span class="chip">挑战集</span>':'')+'</h5><p><b>混杂分析：</b>'+esc(row.analysis_zh||row.alternative_explanation_zh)+'</p><dl><dt>影响窗口</dt><dd>'+esc((row.affected_windows||[]).join('、'))+'</dd><dt>机制重叠</dt><dd>'+esc(row.mechanism_overlap)+'</dd><dt>竞争解释</dt><dd>'+esc(row.alternative_explanation_zh)+'</dd><dt>归因边界</dt><dd>'+esc(row.attribution_limit_zh)+'</dd></dl><b>区分检验</b><ul>'+tests+'</ul><b>反证</b><ul>'+counters+'</ul><div class="node-evidence-list">'+evidence+'</div></article>';
  }).join('')+'</div>';
}
industryDetail=function(event){
  const impact=selectedIndustryImpact(event);
  if(!impact)return '<div class="detail industry-detail"><div class="empty">行业影响详情待生成。</div></div>';
  state.industryMappingId=impact.event_industry_mapping_id;
  const chain=impact.mechanism_chain||{};
  const driver=impact.driver||{};
  const companies=impact.company_links||[];
  const evidence=(impact.evidence||[]).map(closureEvidenceCard).join('')||'<div class="empty">逐节点证据待核验。</div>';
  const companyLinks=companies.map(function(row){return '<button class="industry-company-link" data-industry-company="'+esc(row.company_id)+'">'+esc(row.company_name)+' · '+esc(row.company_code)+'</button>'}).join('')||'<div class="empty">行业机制已建立，当前尚未配置公司样本。</div>';
  const labels=(impact.segment_labels_zh||[]).map(function(label){return '<span class="chip">'+esc(label)+'</span>'}).join('');
  return '<div class="detail industry-detail"><div class="detail-head"><div><span class="eyebrow">'+esc(impact.event_industry_mapping_id)+' · '+esc(industryTierLabels[impact.impact_tier])+'</span><h3>行业影响详情 · '+esc(impact.display_name_zh)+'</h3><p>'+esc(impact.event_title_zh)+' → '+esc(impact.behavior_change_zh)+' → '+esc(impact.observable_driver_zh)+'</p></div><span class="chip warn">'+esc(status(impact.review_status))+'</span></div><div class="chips"><span class="chip">'+esc(impact.classification_edition)+' · '+esc(impact.sw1_id)+'</span>'+labels+'<span class="chip warn">'+esc((impact.completion||{}).completion_status||'OPEN')+'</span></div><div class="industry-fact-box"><b>事件锚点</b><p>'+esc(impact.anchor_fact||impact.event_title_zh)+'</p><small>发生：'+esc(impact.anchor_occurred_at||'待核验')+' · 首次公开：'+esc(impact.anchor_first_public_at||'待核验')+'</small></div><h4>七步行业机制链</h4><div class="mechanism-flow">'+industryMechanismDetail(chain)+'</div><div class="industry-research-box"><div><b>三期限方向</b>'+industryDirectionChips(chain.horizon_directions)+'</div><div><b>生效条件</b><br>'+esc((chain.conditions_zh||[]).join('；')||'待补')+'</div><div><b>失效条件</b><br>'+esc((chain.invalidation_conditions_zh||[]).join('；')||'待补')+'</div></div><div class="industry-detail-layout"><div><h4>T-20 至 D20 行业、沪深300与驱动对比</h4><div class="legend"><span><i style="background:#a63f35"></i>'+esc(impact.display_name_zh)+'</span><span><i style="background:#236b66"></i>沪深300</span><span><i style="background:#9a721e"></i>主驱动（右轴）</span></div><div class="chart-wrap">'+industryChart(impact)+'</div></div><div>'+closureDriverHtml(driver)+'</div></div><h4>固定行情窗口</h4><div class="table-wrap"><table class="market-table"><thead><tr><th>窗口</th><th>实际交易日</th><th>行业指数</th><th>行业收益</th><th>沪深300</th><th>大盘收益</th><th>相对收益</th></tr></thead><tbody>'+industryWindowTable(impact)+'</tbody></table></div><h4>证据来源</h4><div class="evidence-list">'+evidence+'</div><h4>混杂、竞争解释与反证</h4>'+closureConfounderHtml(chain)+'<div class="notice">价格仅用于验证，不用于选择行业或生成方向；MATERIAL、DOMINANT 与 UNRESOLVED 仅进入挑战集。</div><h4>关联公司样本</h4><div class="industry-company-links">'+companyLinks+'</div><details class="raw-details"><summary>技术详情与完成门禁</summary><div class="raw-details-body"><p><code>'+esc(impact.event_industry_mapping_id)+'</code></p><p>主驱动：<code>'+esc(driver.driver_series_id||'DATA_PENDING')+'</code></p><p>阻塞项：'+esc(((impact.completion||{}).blockers||[]).join('、')||'无')+'</p><p>formal_ready=false · sha_gate=DEFERRED · review_status='+esc(impact.review_status)+'</p></div></details></div>';
};
renderMain();
</script>

<script>
const qaTaskLabels={MAIN_REASONING:'综合研判',EVIDENCE_AUDIT:'证据核查',MARKET_VALIDATION:'行情验证',INDUSTRY_COMPANY:'行业—公司'};
const qaLayerLabels={SOURCE_FACTS:'来源事实',RESEARCH_INFERENCE:'研究推断',CALCULATED_FACTS:'计算事实',REFUSAL_AND_BOUNDARIES:'拒答与边界'};
function qaPair(event){
  const rows=event.qa||[];
  return rows.find(row=>row.case.task_type===state.qaTaskType)||rows[0]||null;
}
function qaEvidenceHtml(rows){
  if(!rows.length)return '<div class="empty">截止日前没有满足原文、定位符与直达链接合同的证据。</div>';
  return '<div class="qa-evidence-grid">'+rows.slice(0,6).map(row=>'<article class="qa-evidence"><b>'+esc(row.publisher||row.evidence_id)+'</b><p>'+esc(row.original_quote)+'</p><small>'+esc(row.locator)+' · 首次公开 '+esc(row.first_public_at)+'</small><small>SHA-256 '+esc(row.snapshot_sha256||'待补')+'</small><a class="evidence-link" href="'+esc(row.source_url)+'" target="_blank" rel="noopener noreferrer">查看官方原文</a></article>').join('')+'</div>';
}
function qaMechanismHtml(answer){
  const steps=answer.mechanism_chain||[];
  const horizons=answer.horizon_summary||{};
  return '<div class="qa-mechanism">'+steps.map(row=>'<div class="qa-step"><b>'+esc(row.step)+' · '+esc(row.node_type)+'</b><p>'+esc(row.statement_zh||'待人工复核')+'</p></div>').join('')+'</div><div class="qa-horizons">'+[['IMMEDIATE','即时'],['SHORT_TERM','短期'],['MEDIUM_TERM','中期']].map(([key,label])=>'<div class="qa-horizon"><b>'+label+'</b>'+esc(horizons[key]||'UNKNOWN')+'</div>').join('')+'</div>';
}
function qaImpactsHtml(rows){
  return '<div class="qa-impact-list">'+rows.map(row=>'<div class="qa-impact"><b>'+esc(row.industry_name_zh)+' · '+esc(row.impact_tier)+'</b><small>'+esc((row.horizon_directions||{}).IMMEDIATE||'UNKNOWN')+' / '+esc((row.horizon_directions||{}).SHORT_TERM||'UNKNOWN')+' / '+esc((row.horizon_directions||{}).MEDIUM_TERM||'UNKNOWN')+'</small><p>'+esc(row.behavior_change_zh||row.observable_driver_zh||'机制待复核')+'</p></div>').join('')+'</div>';
}
function qaMarketHtml(rows){
  const keys=['T_MINUS_1','T0','D1','D3','D5','D20'];
  return '<div class="table-wrap"><table class="qa-market-table"><thead><tr><th>行业</th>'+keys.map(key=>'<th>'+esc(key.replace('T_MINUS_1','T-1'))+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr><td>'+esc(row.industry_name_zh)+'</td>'+keys.map(key=>{const point=(row.fixed_windows||{})[key];return '<td>'+(!point||point.market_relative_return==null?'—':pct(point.market_relative_return))+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>';
}
function qaRefusalHtml(rows){
  if(!rows.length)return '<div class="qa-boundary">当前未登记强制拒答项，但结论仍保持候选状态并等待人工审核。</div>';
  return '<div class="qa-refusals">'+rows.slice(0,8).map(row=>'<div class="qa-refusal"><span>'+esc(row.scope_id)+'</span><b>'+esc(row.direction)+' · '+esc(row.decision)+' · '+esc(row.refusal_reason)+'</b></div>').join('')+'</div>';
}
function qaSection(event){
  if(state.qaEventId!==event.event_id){state.qaEventId=event.event_id;state.qaTaskType='MAIN_REASONING'}
  const pair=qaPair(event);
  if(!pair)return '<section class="section qa-section" id="qa"><div class="empty">研究问答候选包未加载。</div></section>';
  const question=pair.case,answer=pair.answer,layers=answer.answer_layers||{};
  const tabs=Object.keys(qaTaskLabels).map(key=>'<button class="qa-tab '+(key===answer.task_type?'active':'')+'" data-qa-task="'+key+'" role="tab" aria-selected="'+(key===answer.task_type)+'">'+qaTaskLabels[key]+'</button>').join('');
  const source=layers.SOURCE_FACTS||{},inference=layers.RESEARCH_INFERENCE||{},calculated=layers.CALCULATED_FACTS||{},boundary=layers.REFUSAL_AND_BOUNDARIES||{};
  return '<section class="section qa-section" id="qa"><div class="section-head"><div><h2>研究问答</h2><p>围绕当前宏观事件补足证据、机制、行情和公司边界</p></div><div class="qa-head-meta"><span class="chip warn">'+esc(status(answer.status))+'</span><span class="chip">'+esc(status(answer.review_status))+'</span><span class="chip">截止 '+esc(answer.prediction_cutoff_at)+'</span></div></div><div class="qa-tabs" role="tablist" aria-label="研究问答视角">'+tabs+'</div><div class="qa-question"><b>'+esc(question.task_label_zh)+'</b><p>'+esc(question.question_zh)+'</p></div><div class="qa-focus"><p>'+esc(answer.answer_focus_zh)+'</p><div class="qa-status">formal_ready=false<br>sha_gate=DEFERRED</div></div><article class="qa-layer"><h3>'+qaLayerLabels.SOURCE_FACTS+'</h3><p>'+esc(source.summary_zh)+'</p>'+qaEvidenceHtml(answer.evidence||[])+'</article><article class="qa-layer"><h3>'+qaLayerLabels.RESEARCH_INFERENCE+'</h3><p>'+esc(inference.summary_zh)+'</p>'+qaMechanismHtml(answer)+qaImpactsHtml(answer.industry_impacts||[])+'</article><article class="qa-layer"><h3>'+qaLayerLabels.CALCULATED_FACTS+'</h3><p>'+esc(calculated.summary_zh)+'</p>'+qaMarketHtml(answer.market_windows||[])+'</article><article class="qa-layer"><h3>'+qaLayerLabels.REFUSAL_AND_BOUNDARIES+'</h3><p>'+esc(boundary.summary_zh)+'</p>'+qaRefusalHtml(answer.refusals||[])+'<div class="qa-jumps"><button class="qa-jump" data-qa-jump="timeline">下钻时间线</button><button class="qa-jump" data-qa-jump="transmission">下钻传导链</button><button class="qa-jump" data-qa-jump="industries">下钻行业</button><button class="qa-jump" data-qa-jump="companies">下钻公司</button></div></article></section>';
}
function bindQa(){
  document.querySelectorAll('[data-qa-task]').forEach(button=>button.onclick=()=>{state.qaTaskType=button.dataset.qaTask;renderMain();document.getElementById('qa').scrollIntoView({block:'start'})});
  document.querySelectorAll('[data-qa-jump]').forEach(button=>button.onclick=()=>{const target=document.getElementById(button.dataset.qaJump);if(target)target.scrollIntoView({block:'start'})});
}
renderMain=function(){
  const event=currentEvent();if(!state.qaTaskType)state.qaTaskType='MAIN_REASONING';if(!state.companyId&&event.companies.length)state.companyId=event.companies[0].company_id;
  document.getElementById('main').innerHTML='<section class="hero" id="overview"><div><span class="eyebrow">'+event.event_id.toUpperCase()+' · 高质量候选链</span><h1>'+esc(event.title)+'</h1><p>宏观事件为一级对象；问答用于补足事件证据、机制、行情与公司边界。</p></div><div class="hero-status"><b>正式发布：未就绪</b><span>AI 方向与公司公告均需人工复核</span></div></section><div class="metrics"><div class="metric"><b>'+event.summary.timeline_count+'</b><span>时间线节点</span></div><div class="metric"><b>'+event.summary.industry_mapping_count+'</b><span>行业影响</span></div><div class="metric"><b>'+event.summary.company_count+'</b><span>公司评估</span></div><div class="metric"><b>'+((event.qa||[]).length)+'</b><span>研究问题</span></div></div><nav class="section-jumps" aria-label="事件内容分布"><a href="#overview">事件概览</a><a href="#qa">研究问答</a><a href="#timeline">事件时间线</a><a href="#transmission">动态传导链</a><a href="#industries">行业影响</a><a href="#companies">公司影响</a></nav><div class="notice">本页为候选研究数据。证据存在不等于因果已确认；行情只用于验证，不用于事后选择方向。</div>'+qaSection(event)+'<section class="section" id="timeline"><div class="section-head"><h2>事件时间线</h2><p>点击节点联动其锚定的传导边</p></div><div class="timeline">'+renderTimeline(event)+'</div></section><section class="section" id="transmission"><div class="section-head"><h2>动态传导链</h2><p>即时、短期与中期方向均保持独立审核状态</p></div><div class="transmission-toolbar"><div class="transmission-tabs" role="tablist" aria-label="传导链视图"><button class="transmission-tab '+(state.transmissionMode==='operating'?'active':'')+'" data-transmission-mode="operating" role="tab">经营影响链</button><button class="transmission-tab '+(state.transmissionMode==='macro'?'active':'')+'" data-transmission-mode="macro" role="tab">宏观市场链</button><button class="transmission-tab '+(state.transmissionMode==='industry'?'active':'')+'" data-transmission-mode="industry" role="tab">行业板块链</button></div><button class="plain-button" id="show-all-paths">显示全部路径</button></div><div class="path-list">'+renderTransmission(event)+'</div></section><section class="section" id="industries"><div class="section-head"><h2>行业影响</h2><p>直接影响、二阶传导与条件性影响完整保留</p></div><div class="industry-strip">'+renderIndustries(event)+'</div></section><section class="section" id="companies"><div class="section-head"><h2>公司影响</h2><p>每个事件固定三家公司，禁止事后按股价挑选</p></div><div class="company-grid">'+renderCompanies(event)+'</div>'+companyDetail(event)+'</section><footer class="footer">数据版本 '+esc(DATA.dataset_version)+' · formal_ready=false · SHA 门禁 DEFERRED · 页面不包含隐藏评测标签</footer>';
  bind(event);bindQa();
};
renderMain();
</script>

<script>
function bindQaIndustryIntegration(event){
  document.querySelectorAll('[data-industry-tier]').forEach(function(button){button.onclick=function(){
    state.industryTier=button.dataset.industryTier;
    renderMain();
    requestAnimationFrame(function(){const group=document.querySelector('[data-industry-group="'+state.industryTier+'"]');if(group)group.scrollIntoView({behavior:'smooth',block:'start'})});
  }});
  document.querySelectorAll('[data-industry-mapping],[data-industry-detail]').forEach(function(button){button.onclick=function(){
    const mappingId=button.dataset.industryMapping||button.dataset.industryDetail;
    const impact=industryImpact(event,mappingId);
    state.industryMappingId=mappingId;
    state.industryTier=impact?impact.impact_tier:state.industryTier;
    state.industryId=impact?impact.sw1_id:null;
    if(button.dataset.industryDetail)state.transmissionMode='industry';
    state.companyId=null;
    renderMain();
    requestAnimationFrame(function(){const detail=document.querySelector('.industry-detail');if(detail)detail.scrollIntoView({behavior:'smooth',block:'start'})});
  }});
  document.querySelectorAll('[data-industry-company]').forEach(function(button){button.onclick=function(){
    state.companyId=button.dataset.industryCompany;
    renderMain();
    requestAnimationFrame(function(){const grid=document.querySelector('.company-grid');if(grid)grid.scrollIntoView({behavior:'smooth',block:'start'})});
  }});
}
const qaRenderMainWithSections=renderMain;
renderMain=function(){
  qaRenderMainWithSections();
  const event=currentEvent();
  const section=document.getElementById('industries');
  if(section&&!section.querySelector('.industry-detail'))section.insertAdjacentHTML('beforeend',industryDetail(event));
  bindQaIndustryIntegration(event);
};
renderMain();
</script>

<script>
const directionLabelZh={POSITIVE:'正向',NEGATIVE:'负向',MIXED:'分化',UNKNOWN:'未知'};
const tierLabelZh={CORE_DIRECT:'直接影响',SECOND_ORDER:'二阶传导',CONDITIONAL:'条件性影响'};
const nodeTypeLabelZh={EVENT_FACT:'事件事实',BEHAVIOR_OR_POLICY_CHANGE:'行为或政策变化',OBSERVABLE_DRIVER:'可观察驱动',INDUSTRY_OPERATING_VARIABLE:'行业经营变量',INDUSTRY_REVENUE_OR_COST_VARIABLE:'行业收入或成本变量',DIRECTION_ASSESSMENT:'方向研判',PRICE_CONFOUNDER_AND_COUNTEREVIDENCE:'行情、混杂与反证'};
const refusalReasonZh={ANCHOR_POST_CUTOFF:'事件锚点晚于截止日',INDUSTRY_CLOSURE_OPEN:'行业证据闭环尚未关闭',COMPANY_CLOSURE_OPEN:'公司证据闭环尚未关闭',TRADING_STATUS_UNVERIFIED:'停复牌状态尚未核验',CONFOUNDER_MATERIAL:'存在重大混杂因素',CONFOUNDER_DOMINANT:'混杂因素可能占主导',CONFOUNDER_UNRESOLVED:'混杂因素尚未解决'};
function qaDirectionClass(value){return ({POSITIVE:'positive',NEGATIVE:'negative',MIXED:'mixed',UNKNOWN:'unknown'})[value]||'unknown'}
function qaEvidenceHtml(rows){
  if(!rows.length)return '<div class="empty">截止日前没有满足原文、定位符与直达链接合同的证据。</div>';
  return '<div class="qa-evidence-grid">'+rows.slice(0,8).map(function(row){return '<article class="qa-evidence"><div class="qa-evidence-head"><b>'+esc(row.publisher_zh||row.publisher||row.evidence_id)+'</b><span class="chip">'+esc(row.source_tier||'官方来源')+'</span></div><h4>中文事实摘录</h4><p class="fact-zh">'+esc(row.fact_zh||row.original_quote)+'</p><small>'+esc(row.locator_zh||'官方页面对应引文段落')+' · 首次公开 '+esc(row.first_public_at)+'</small><details class="qa-source-original"><summary>审计原文</summary><blockquote>'+esc(row.original_quote)+'</blockquote><small>原始发布机构：'+esc(row.publisher||'待核验')+'</small><small>原始定位：'+esc(row.locator||'待核验')+'</small><small>SHA-256 '+esc(row.snapshot_sha256||'待补')+'</small></details><a class="evidence-link" href="'+esc(row.source_url)+'" target="_blank" rel="noopener noreferrer">查看官方原文</a></article>'}).join('')+'</div>';
}
function qaMechanismHtml(answer){
  const steps=answer.mechanism_chain||[];
  const summaries=answer.horizon_summary_zh||{};
  const raw=answer.horizon_summary||{};
  const stages=[['IMMEDIATE','即时'],['SHORT_TERM','短期'],['MEDIUM_TERM','中期']];
  return '<div class="qa-mechanism">'+steps.map(function(row){return '<div class="qa-step"><b>'+esc(row.step)+' · '+esc(row.node_type_zh||nodeTypeLabelZh[row.node_type]||'研究节点')+'</b><p>'+esc(row.statement_zh||'待人工复核')+'</p></div>'}).join('')+'</div><div class="qa-horizons">'+stages.map(function(item){const key=item[0],label=item[1],direction=raw[key]||'UNKNOWN';return '<div class="qa-horizon '+qaDirectionClass(direction)+'"><b>'+label+' · '+esc(directionLabelZh[direction]||'未知')+'</b><strong>'+esc(summaries[key]||'阶段性结论待补充')+'</strong></div>'}).join('')+'</div>';
}
function qaImpactFact(label,value){return '<div class="qa-impact-fact"><b>'+label+'</b>'+esc(value||'待核验')+'</div>'}
function qaImpactsHtml(rows){
  const stages=[['IMMEDIATE','即时'],['SHORT_TERM','短期'],['MEDIUM_TERM','中期']];
  return '<div class="qa-impact-list">'+rows.map(function(row){
    const details=row.horizon_details||{};
    const stageHtml=stages.map(function(item){const key=item[0],label=item[1],direction=(row.horizon_directions||{})[key]||'UNKNOWN',detail=details[key]||{};return '<div class="qa-impact-stage '+qaDirectionClass(direction)+'"><b>'+label+' · '+esc(detail.direction_zh||directionLabelZh[direction]||'未知')+'</b><p>'+esc(detail.detail_zh||'该阶段的经营与财务传导待补充。')+'</p></div>'}).join('');
    return '<article class="qa-impact"><div class="qa-impact-head"><b>'+esc(row.industry_name_zh)+'</b><span class="qa-tier">'+esc(row.impact_tier_zh||tierLabelZh[row.impact_tier]||'影响层级待核验')+'</span></div><div class="qa-impact-facts">'+qaImpactFact('可观察驱动',row.observable_driver_zh)+qaImpactFact('经营变量',row.industry_operating_variable_zh)+qaImpactFact('财务变量',row.industry_financial_variable_zh)+qaImpactFact('传导变化',row.behavior_change_zh)+'</div><div class="qa-impact-stages">'+stageHtml+'</div><div class="qa-boundaries"><span><b>成立条件：</b>'+esc(row.condition_zh||'待核验')+'</span><span><b>失效条件：</b>'+esc(row.invalidation_condition_zh||'待核验')+'</span></div></article>';
  }).join('')+'</div>';
