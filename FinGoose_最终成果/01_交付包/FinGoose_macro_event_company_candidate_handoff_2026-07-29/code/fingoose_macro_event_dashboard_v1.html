<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinGoose 事件—公司影响工作台</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--bg:#0e1216;--panel:#151b20;--panel2:#1b2329;--line:#2b373f;--text:#e8eef1;--muted:#91a0a9;--green:#5ee39b;--cyan:#5ec8e5;--amber:#f4b65d;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;font-size:14px;letter-spacing:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1600px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0 16px}.brand h1{font-size:22px;margin:0 0 5px}.brand p,.muted{margin:0;color:var(--muted)}.flags,.status-row{display:flex;gap:7px;flex-wrap:wrap}.badge,.status{display:inline-flex;border:1px solid var(--line);padding:4px 7px;border-radius:4px;font-size:12px}.candidate,.unknown{color:var(--amber)}.candidate{border-color:#77582c}.false,.danger{color:var(--red)}.false{border-color:#753d3d}.verified{color:var(--green)}.tabs{display:flex;gap:2px;margin:16px 0;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:var(--text);border-color:var(--green)}.view{display:none}.view.active{display:block}.metrics{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px}.metric,.band,.task{background:var(--panel);border:1px solid var(--line);border-radius:6px}.metric{padding:14px;min-height:90px}.metric b{display:block;font-size:25px;margin-top:9px}.metric span{color:var(--muted)}.band{margin-top:12px;padding:14px}.band h2,.band h3,.task h3,.task h4{margin:0 0 11px;font-size:16px}.split{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.event-list,.company-list{max-height:72vh;overflow:auto}.list-btn{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--line);padding:11px}.list-btn:hover,.list-btn.active{background:#202b31}.list-btn small{display:block;color:var(--muted);margin-top:4px}.filters{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px;margin-bottom:12px}.filters input,.filters select{width:100%;background:#11171b;color:var(--text);border:1px solid var(--line);padding:9px;border-radius:4px}.task{background:var(--panel2);padding:12px}.chain{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;overflow:auto}.chain-node{min-height:112px;overflow-wrap:anywhere;word-break:break-word;background:#11171b;color:var(--text);border:1px solid var(--line);padding:9px;text-align:left;border-radius:5px}.chain-node:hover{border-color:var(--cyan)}.chain-node b{display:block;color:var(--cyan);font-size:11px;margin-bottom:8px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}.scroll{overflow:auto}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.source-detail{margin-top:10px;background:#0f1519;border:1px solid var(--line);padding:12px;border-radius:5px;overflow-wrap:anywhere}.source-detail a{color:var(--cyan)}.empty{color:var(--muted);padding:20px;text-align:center}.notice{border-left:3px solid var(--amber);padding:9px 12px;background:#231d14;color:#e7c991;margin-bottom:12px}.reviews td{font-size:12px}@media(max-width:900px){.shell{padding:12px}.top{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.grid2{grid-template-columns:1fr}.event-list,.company-list{max-height:280px}.chain{grid-template-columns:repeat(7,170px)}.detail-head{flex-direction:column}}@media(max-width:480px){.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}
html,body{max-width:100%;overflow-x:hidden}.split>*{min-width:0}.band,.task{min-width:0;overflow:hidden}.notice,.task,.source-detail{overflow-wrap:anywhere;word-break:break-word}.chain{width:100%;max-width:100%}</style></head><body><main class="shell">
<header class="top"><div class="brand"><h1>FinGoose 事件—公司影响工作台</h1><p>重大事件 → 市场波动 → 公司传导 → 候选训练样本</p></div><div class="flags"><span class="badge candidate">候选训练版</span><span class="badge false">尚未达到正式版</span></div></header>
<nav class="tabs"><button class="tab active" data-view="overview">数据集概览</button><button class="tab" data-view="market">市场归因</button><button class="tab" data-view="company">公司影响</button><button class="tab" data-view="review">审核记录</button></nav>
<section id="overview" class="view active"><div class="notice">本页展示候选训练版；公司层证据、行情和复审仍待补齐，不可当作正式发布数据。</div><div id="metrics" class="metrics"></div><div class="band"><h2>推理链</h2><div id="reasoning-chain" class="chain"></div></div><div class="band"><h2>候选版门禁</h2><div id="gate-detail"></div></div></section>
<section id="market" class="view"><div class="split"><aside class="band"><h2>事件</h2><div id="event-list" class="event-list"></div></aside><div id="event-content" class="band"><div class="empty">加载事件...</div></div></div></section>
<section id="company" class="view"><div class="filters"><select id="event-filter"><option value="">全部事件</option></select><input id="company-filter" placeholder="公司名称或代码"><select id="association-filter"><option value="">全部关联标签</option><option value="VERIFIED_ASSOCIATION">已验证关联</option><option value="CONTRIBUTING_ASSOCIATION">贡献性关联</option><option value="WEAK_RELATION">弱关联</option><option value="UNSUPPORTED">不支持</option></select><select id="direction-filter"><option value="">全部方向</option><option value="UP">上升</option><option value="DOWN">下降</option><option value="MIXED">混合</option><option value="UNCERTAIN">不确定</option></select><select id="evidence-filter"><option value="">全部证据状态</option><option value="VERIFIED">已验证</option><option value="PARTIAL_EVIDENCE">部分证据</option><option value="PENDING_EVIDENCE">待补证</option></select><select id="review-filter"><option value="">全部审核状态</option><option value="AI_INITIAL_REVIEW_COMPLETED">AI初审已完成</option><option value="SECOND_REVIEW_REQUIRED">待复审</option><option value="PENDING_EVIDENCE">待补证</option><option value="REJECTED">已拒绝</option><option value="VERIFIED">已验证</option></select></div><div class="split"><aside class="band"><h2>公司档案 <span id="company-count" class="muted"></span></h2><div id="company-list" class="company-list"></div></aside><div id="company-detail" class="band"><div class="empty">选择公司查看完整传导链</div></div></div></section>
<section id="review" class="view"><div class="band"><h2>审核记录</h2><div class="scroll"><table class="reviews"><thead><tr><th>领域</th><th>事件</th><th>公司/样本</th><th>状态</th><th>初审人</th><th>复审触发</th></tr></thead><tbody id="review-body"></tbody></table></div></div></section>
</main><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(await r.text());return r.json()};
const state={events:[],companies:[],reviews:[],detail:null};
const LABELS={
  CANDIDATE:'候选训练版',VERIFIED:'已验证',VERIFIED_EVIDENCE:'已验证',PARTIAL_EVIDENCE:'部分证据',PENDING_EVIDENCE:'待补证',AI_INITIAL_REVIEW_COMPLETED:'AI初审已完成',SECOND_REVIEW_REQUIRED:'待复审',REJECTED:'已拒绝',
  PENDING_ASSESSMENT:'\u5c1a\u672a\u5224\u65ad',
  VERIFIED_ASSOCIATION:'已验证关联',CONTRIBUTING_ASSOCIATION:'贡献性关联',PRIMARY_DRIVER:'主要驱动因素',CONTRIBUTING_FACTOR:'贡献因素',WEAK_RELATION:'弱关联',UNSUPPORTED:'不支持',
  UP:'上升',DOWN:'下降',MIXED:'混合',UNCERTAIN:'不确定',HIGH:'高置信度',MEDIUM:'中置信度',LOW:'低置信度',UNKNOWN:'未知',
  ACCELERATE:'加速',STABLE:'稳定',DECELERATE:'减速',INCONCLUSIVE:'证据不足',IMPROVE:'改善',DETERIORATE:'恶化',LOSS:'亏损',
  single_asset_attribution_forecast:'单资产归因与预测',cross_asset_attribution_forecast:'跨资产归因与预测',
  public_health:'公共卫生',geopolitical_conflict:'地缘政治冲突',monetary_policy:'货币政策',public_health_policy:'公共卫生政策',financial_stability:'金融稳定',commodity_supply:'大宗商品供给',monetary_and_financial_policy:'货币与金融政策',trade_policy:'贸易政策',
  MAJOR_EVENT:'重大事件',INDUSTRY_MACRO_VARIABLE:'行业与宏观变量',COMPANY_BUSINESS_EXPOSURE:'公司业务暴露',OPERATING_METRIC:'经营指标',FINANCIAL_RESULT:'财务结果',COMPETING_EXPLANATION:'竞争解释',ATTRIBUTION_OR_FORECAST:'归因或预测',
  REVENUE:'营业收入',GROSS_MARGIN:'毛利率',NET_PROFIT:'净利润',OPERATING_CASH_FLOW:'经营活动现金流',REVENUE_MOMENTUM:'收入动量',PROFIT_STATE:'利润状态',
  MACRO_REPORT:'宏观研报',DATA:'数据',PERIOD_DESCRIPTION:'期间描述',FACT_TRANSMISSION_CHAIN:'事实传导链',MULTI_DATA_TREND_CONFIRMATION:'多重数据趋势确认',SHORT_TERM_PREDICTION:'短期预测',
  COMPANY_EVIDENCE_INCOMPLETE:'公司层证据尚未补齐',PRICE_WINDOWS_PENDING:'个股与市场行情窗口待补',GOLD_LABELS_PENDING:'黄金标签待核验',FORMAL_REVIEWS_INCOMPLETE:'正式复审尚未完成',
  LOW_CONFIDENCE:'低置信度',CORE_DIMENSION_UNKNOWN:'核心维度未知',EVENT_CHANNEL_NOT_EXPLICITLY_DISCLOSED:'事件传导渠道未明确披露',
  MARKET:'市场',COMPANY:'公司',SP500:'标普500指数（SP500）',VIXCLS:'VIX波动率指数（VIXCLS）',DCOILWTICO:'WTI原油现货（DCOILWTICO）',DCOILBRENTEU:'布伦特原油现货（DCOILBRENTEU）',DGS10:'美国10年期国债收益率（DGS10）',DTWEXBGS:'美元广义指数（DTWEXBGS）',DEXCHUS:'美元兑人民币（DEXCHUS）',DEXJPUS:'美元兑日元（DEXJPUS）'
};
const EVENT_TITLES={
  'event-01':'世界卫生组织将新冠疫情定性为全球大流行','event-02':'俄乌冲突全面升级','event-03':'美联储加息75个基点','event-04':'中国发布优化疫情防控“新十条”','event-05':'硅谷银行关闭及紧急稳定措施出台','event-06':'OPEC+宣布额外自愿减产','event-07':'中东冲突升级','event-08':'日本央行结束负利率政策','event-09':'中国发布金融支持政策组合','event-10':'美国宣布新一轮广泛关税措施'
};
const TEXTS={
  'WHO assessed that COVID-19 could be characterized as a pandemic.':'世界卫生组织评估认为，新冠疫情可被定性为全球大流行。',
  'NATO documented the large-scale attack and escalation.':'北约记录了大规模攻击及冲突升级。',
  'The FOMC announced a 75 basis point increase.':'美国联邦公开市场委员会宣布加息75个基点。',
  'The official page records release of ten optimized measures.':'官方页面记录了优化疫情防控“新十条”的发布。',
  'FDIC records the closure and receivership.':'美国联邦存款保险公司记录了关闭及接管事项。',
  'The statement describes emergency stabilization measures.':'声明介绍了紧急稳定措施。',
  'OPEC documented additional voluntary production cuts.':'石油输出国组织记录了额外自愿减产。',
  'The same-day UN statement documents the attacks and escalation.':'联合国当日声明记录了袭击及冲突升级。',
  'The BOJ ended the negative short-rate setting.':'日本央行结束了负的短期政策利率。',
  'The briefing announced monetary, housing and market support.':'新闻发布会宣布了货币、住房和资本市场支持措施。',
  'The order established a broad reciprocal tariff framework.':'该行政令建立了广泛的对等关税框架。',
  'The report documented expanding global cases and transmission.':'报告记录了全球病例增加及疫情传播情况。',
  'The report describes inflation and tighter financial conditions.':'报告说明了通胀与金融条件收紧的情况。',
  'The briefing describes mobility and activity changes.':'新闻发布会介绍了人员流动与经济活动变化。',
  'The outlook supplies the policy-normalization baseline.':'展望报告提供了政策正常化基准。',
  'The outlook supplies the pre-cut oil baseline.':'展望报告提供了减产前的油市基准。',
  'The outlook supplies the pre-event energy baseline.':'展望报告提供了事件发生前的能源市场基准。',
  'The report describes oil conditions by the D3 cutoff.':'报告说明了截至第三个交易日预测截点的油市状况。',
  'The report supplies the pre-package macro and credit baseline.':'报告提供了政策组合发布前的宏观与信贷基准。',
  'The fact sheet describes the measures and transmission logic.':'情况说明介绍了措施及其传导逻辑。',
  'No archived official company disclosure currently verifies the candidate business exposure.':'当前没有已归档的公司官方披露可核实候选业务暴露。',
  'No archived official company evidence currently supports a comparable operating metric.':'当前没有已归档的公司官方证据支持可比经营指标。',
  'No archived official company reports currently support standalone-quarter financial results.':'当前没有已归档的公司官方报告支持单季度财务结果。',
  'No archived company-specific evidence currently supports a competing explanation assessment.':'当前没有已归档的公司特定证据支持竞争解释评估。',
  'Attribution and forecast labels remain unknown until company evidence and independent review exist.':'在公司证据补齐并完成独立复审前，归因与预测标签保持未知。',
  'No archived auditable company and CSI 300 price series is available; returns remain unknown.':'当前没有已归档且可审计的公司与沪深300价格序列，收益率保持未知。',
  'URL unavailable':'暂无来源链接'
};
const PUBLISHERS={'Bank of Japan':'日本银行','Federal Deposit Insurance Corporation':'美国联邦存款保险公司','Federal Reserve Board':'美国联邦储备委员会','Guangzhou Municipal Government':'广州市人民政府','NATO':'北大西洋公约组织','OPEC':'石油输出国组织','People\'s Bank of China':'中国人民银行','State Council of China':'中国国务院','The White House':'美国白宫','U.S. Energy Information Administration':'美国能源信息署','United Nations':'联合国','World Health Organization':'世界卫生组织'};
const labelText=v=>LABELS[v]||TEXTS[v]||PUBLISHERS[v]||v||'未知';
const eventIdText=id=>/^event-\d+$/.test(id||'')?`事件${String(id).slice(-2)}`:(id||'');
const eventText=e=>EVENT_TITLES[e?.event_id]||labelText(e?.title);
const valueText=v=>labelText(v==null||v===''?'UNKNOWN':v);
const statusText=v=>labelText(v||'UNKNOWN');
const forecastTypeText=v=>v==='OPERATING_METRIC'?'核心经营指标':labelText(v);
function status(v){const c=/VERIFIED/.test(v)?'verified':/REJECT|LOW/.test(v)?'danger':'unknown';return `<span class="status ${c}">${esc(statusText(v))}</span>`}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view))});
function showView(id){const b=$(`.tab[data-view="${id}"]`);if(b)b.click()}
function renderOverview(o){const c=o.company||{},m=o.computed||{};const data=[['宏观事件',m.event_count],['市场题',m.sample_count],['公司档案',c.company_dossier_count],['候选样本',c.candidate_sample_count],['待复审',c.second_review_required_count],['待补证缺口',c.evidence_gap_count]];$('#metrics').innerHTML=data.map(x=>`<div class="metric"><span>${x[0]}</span><b>${x[1]??0}</b></div>`).join('');$('#reasoning-chain').innerHTML=(o.reasoning_chain_sequence||[]).map((x,i)=>`<div class="chain-node"><b>0${i+1}</b>${esc(labelText(x))}</div>`).join('');$('#gate-detail').innerHTML=`${status(c.candidate_ready?'VERIFIED':'PENDING_EVIDENCE')} &nbsp; 候选版可用：${c.candidate_ready?'是':'否'} &nbsp; 正式版可用：${c.formal_ready?'是':'否'}<p class="muted">${esc((c.formal_blockers||[]).map(labelText).join(' / '))}</p>`}
function renderEventList(){const box=$('#event-list');box.innerHTML=state.events.map((e,i)=>`<button class="list-btn ${i===0?'active':''}" data-event="${esc(e.event_id)}"><b>${esc(eventIdText(e.event_id))}</b> ${esc(eventText(e))}<small>${esc(e.occurred_at)} · ${e.market_sample_count} 道市场题 · ${e.company_dossier_count} 家公司</small></button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>loadEvent(b.dataset.event))}
async function loadEvent(id){const d=await api('/api/event/'+encodeURIComponent(id));$$('#event-list button').forEach(b=>b.classList.toggle('active',b.dataset.event===id));const market=d.market_samples.map(s=>`<article class="task"><h4>${esc(labelText(s.task_type))}</h4><div>${esc((s.target_series_ids||[]).map(labelText).join(' / '))}</div><p>${status(s.attribution?.label||s.hidden_label?.label)} ${status(s.attribution?.confidence)}</p><small class="muted">样本编号：${esc(s.record_id)}</small></article>`).join('');const companies=d.company_dossiers.map(c=>`<button class="list-btn task" data-dossier="${esc(c.dossier_id)}"><h4>${esc(c.company_name)} <small>${esc(c.company_code)}</small></h4><div>${status(c.evidence_status)} ${status(c.review_status)}</div><p>${esc(labelText(c.association))} / ${esc(labelText(c.direction))}</p></button>`).join('');$('#event-content').innerHTML=`<div class="detail-head"><div><h2>${esc(eventText(d.event))}</h2><p class="muted">${esc(eventIdText(d.event.event_id))} · ${esc(d.event.occurred_at)} · ${esc(labelText(d.event.category))}</p></div>${status('VERIFIED')}</div><h3>4 道市场归因题</h3><div class="grid2">${market}</div><h3 style="margin-top:18px">3 个公司档案</h3><div class="grid2">${companies}</div>`;$('#event-content').querySelectorAll('[data-dossier]').forEach(b=>b.onclick=()=>{showView('company');loadCompany(b.dataset.dossier)})}
function marketWindowSummary(s){return (s.market_windows||[]).map(w=>{const points=['D1','D3','D5','D20'].map(k=>{const p=w.windows?.[k];return p?k+' '+Number(p.change).toFixed(2)+' '+(w.change_unit==='basis_points'?'bp':'%'):k+' --'}).join(' | ');return '<div class="source-detail"><b>'+esc(labelText(w.series?.series_id||''))+'</b><br>'+esc(points)+'</div>'}).join('')||'<div class="muted">\u6682\u65e0\u5e02\u573a\u7a97\u53e3\u6570\u636e</div>'}
const baseLoadEvent=loadEvent;
loadEvent=async function(id){await baseLoadEvent(id);const d=await api('/api/event/'+encodeURIComponent(id));const cards=$$('#event-content .grid2 .task');d.market_samples.forEach((s,i)=>{if(cards[i]&&!cards[i].querySelector('.source-detail'))cards[i].insertAdjacentHTML('beforeend',marketWindowSummary(s))})};
function enrichCompanyMetricUnits(){const rows=$$('#company-detail tbody tr');(state.detail?.metric_facts||[]).forEach((m,i)=>{if(!rows[i]||rows[i].querySelector('.metric-unit'))return;const cell=rows[i].children[1];if(cell)cell.insertAdjacentHTML('beforeend','<small class="metric-unit muted"><br>'+esc(valueText(m.unit))+' / '+esc(valueText(m.currency))+'</small>')})}
const companyMetricObserver=new MutationObserver(enrichCompanyMetricUnits);
companyMetricObserver.observe($('#company-detail'),{childList:true,subtree:true});
$('#association-filter').insertAdjacentHTML('beforeend','<option value="PENDING_ASSESSMENT">\u5c1a\u672a\u5224\u65ad</option>');

function filterQuery(){const ids=['event-filter','company-filter','association-filter','direction-filter','evidence-filter','review-filter'],keys=['event_id','company','association','direction','evidence_status','review_status'],q=new URLSearchParams;ids.forEach((id,i)=>{const v=$('#'+id).value.trim();if(v)q.set(keys[i],v)});return q.toString()}
async function loadCompanies(){state.companies=await api('/api/companies?'+filterQuery());$('#company-count').textContent=`（${state.companies.length}）`;$('#company-list').innerHTML=state.companies.map(c=>`<button class="list-btn" data-dossier="${esc(c.dossier_id)}"><b>${esc(c.company_name)}</b> ${esc(c.company_code)}<small>${esc(eventIdText(c.event_id))} · ${esc(labelText(c.association))} · ${esc(statusText(c.review_status))}</small></button>`).join('')||'<div class="empty">无匹配公司</div>';$('#company-list').querySelectorAll('button').forEach(b=>b.onclick=()=>loadCompany(b.dataset.dossier));if(state.companies.length&&!state.detail)loadCompany(state.companies[0].dossier_id)}
async function loadCompany(id){const d=await api('/api/company/'+encodeURIComponent(id));state.detail=d;$$('#company-list button').forEach(b=>b.classList.toggle('active',b.dataset.dossier===id));const x=d.dossier,a=d.attribution_sample,f=d.forecast_sample,w=d.stock_window||{};const nodes=(x.transmission_chain?.nodes||[]).map((n,i)=>`<button class="chain-node" data-node="${i}"><b>${esc(labelText(n.node_type))}</b><span class="${n.status==='PENDING_EVIDENCE'?'unknown':'verified'}">${esc(valueText(n.value))}</span></button>`).join('');const facts=d.metric_facts.map(m=>`<tr><td>${esc(labelText(m.metric_type))}</td><td>${esc(valueText(m.value))}</td><td>${esc(valueText(m.period))}</td><td>${status(m.status)}</td></tr>`).join('');const labels=(f.forecast_labels||[]).map(v=>`${esc(forecastTypeText(v.label_type))}：<b>${esc(labelText(v.value))}</b>`).join('<br>');const gaps=d.evidence_gaps.map(g=>`<li>${esc(labelText(g.node_type))}：${esc(labelText(g.gap_reason))}</li>`).join('');$('#company-detail').innerHTML=`<div class="detail-head"><div><h2>${esc(x.company_name)} <small>${esc(x.company_code)}</small></h2><p class="muted">${esc(eventIdText(x.event_id))} · 行业：${esc(valueText(x.industry))}</p></div><div class="status-row">${status(x.evidence_status)} ${status(d.review.review_status)}</div></div><div class="notice">业务暴露：${esc(valueText(x.business_exposure?.value))} · ${esc(labelText(x.business_exposure?.gap_reason))}</div><h3>完整传导链</h3><div class="chain">${nodes}</div><div id="chain-node-detail" class="source-detail">点击传导链节点查看引用、定位与哈希。</div><div class="grid2" style="margin-top:12px"><div class="task"><h3>经营与财务指标</h3><div class="scroll"><table><thead><tr><th>指标</th><th>值</th><th>期间</th><th>状态</th></tr></thead><tbody>${facts}</tbody></table></div></div><div class="task"><h3>个股 / 沪深300 辅助窗口</h3><p>${status(w.status)}</p><p>D1 ${esc(valueText(w.windows?.D1))} · D3 ${esc(valueText(w.windows?.D3))} · D5 ${esc(valueText(w.windows?.D5))} · D20 ${esc(valueText(w.windows?.D20))}</p><small class="muted">${esc(labelText(w.gap_reason))}</small></div><div class="task"><h3>归因标签</h3><p><b>${esc(labelText(a.association))}</b> / ${esc(labelText(a.direction))} / ${esc(labelText(a.confidence))}</p><h3>预测输出</h3><p>${labels}</p></div><div class="task"><h3>竞争解释与审核</h3><p>${esc((x.competing_explanations||[]).map(v=>valueText(v.value)).join(' / '))}</p><p>${status(d.review.review_status)}</p><small class="muted">${esc((d.review.second_review_trigger_reasons||[]).map(labelText).join(' / '))}</small></div></div><div class="task" style="margin-top:12px"><h3>证据缺口</h3><ul>${gaps}</ul></div>`;$('#company-detail').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>renderNode(d,+b.dataset.node))}
function renderNode(d,index){const n=d.dossier.transmission_chain.nodes[index],refs=n.evidence_refs||[],sources=refs.map(r=>d.sources.find(s=>s.source_id===r.source_id)||r);$('#chain-node-detail').innerHTML=`<h3>${esc(labelText(n.node_type))}</h3><p>${esc(valueText(n.value))}</p>${sources.length?sources.map(s=>`<div><b>${esc(labelText(s.publisher||s.source_id))}</b> ${status(s.verification_status||'PENDING_EVIDENCE')}<br><a href="${esc(s.source_url||'#')}" target="_blank" rel="noreferrer">${esc(s.source_url||'暂无来源链接')}</a><br><small>定位 ${esc(JSON.stringify(s.source_locator||s.locator||{}))}<br>SHA-256 ${esc(valueText(s.content_sha256))}<br>${esc(labelText(s.summary||s.excerpt||''))}</small></div>`).join('<hr>'):`<p class="unknown">${esc(labelText(n.gap_reason||'暂无绑定引用'))}</p>`}`}
function renderReviews(rows){$('#review-body').innerHTML=rows.map(r=>`<tr><td>${esc(labelText(r.domain))}</td><td>${esc(eventIdText(r.event_id||''))}</td><td>${esc(r.company_code||r.review_id)}</td><td>${status(r.review_status||r.final_status||r.initial_review?.status)}</td><td>${esc(r.initial_reviewer_id||r.initial_review?.reviewer_id||'')}</td><td>${esc((r.second_review_trigger_reasons||r.second_review?.trigger_reasons||[]).map(labelText).join(' / '))}</td></tr>`).join('')}
(async()=>{try{const [o,e,r]=await Promise.all([api('/api/overview'),api('/api/events'),api('/api/reviews')]);state.events=e;state.reviews=r;renderOverview(o);renderEventList();renderReviews(r);const select=$('#event-filter');e.forEach(x=>select.insertAdjacentHTML('beforeend',`<option value="${esc(x.event_id)}">${esc(eventIdText(x.event_id))} ${esc(eventText(x))}</option>`));$$('.filters input,.filters select').forEach(x=>x.addEventListener('change',loadCompanies));$('#company-filter').addEventListener('input',loadCompanies);await Promise.all([loadEvent(e[0].event_id),loadCompanies()])}catch(err){document.body.insertAdjacentHTML('beforeend',`<pre class="danger">页面加载失败：${esc(err)}</pre>`)}})();
</script></body></html>
